name: Pearls AQI - Daily Training Pipeline

on:

  schedule:
    - cron: "30 2 * * *"

  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:

  training_pipeline:

    name: Train AQI Models

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v6

      # ======================================================
      # 2. PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ======================================================
      # 3. DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install \
            pandas \
            pyarrow \
            numpy \
            scikit-learn \
            xgboost \
            joblib \
            mlflow \
            "feast[duckdb]"\
            duckdb

      # ======================================================
      # 4. FIND FEATURE RUN
      # ======================================================

      - name: Find latest successful feature pipeline run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}

        run: |

          RUN_ID=$(gh run list \
            --repo "$REPO" \
            --workflow "feature_pipeline.yml" \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: No successful feature pipeline run."
            exit 1
          fi

          echo "FEATURE_RUN_ID=$RUN_ID" \
            >> "$GITHUB_ENV"

          echo "Latest feature run: $RUN_ID"

      # ======================================================
      # 5. DOWNLOAD FEATURE ARTIFACT
      # ======================================================

      - name: Download latest feature artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FEATURE_RUN_ID: ${{ env.FEATURE_RUN_ID }}

        run: |

          mkdir -p .feature_restore

          gh run download \
            "$FEATURE_RUN_ID" \
            --repo "$REPO" \
            --name aqi-pipeline-data \
            --dir .feature_restore

          find .feature_restore \
            -type f \
            -print

      - name: Verify restored feature dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path("data/processed/aqi_features.parquet")

          assert path.exists(), f"Missing: {path}"

          df = pd.read_parquet(path)

          print("Feature dataset shape:", df.shape)
          print("Columns:", len(df.columns))
          print("First:", df["timestamp"].min())
          print("Last:", df["timestamp"].max())

          assert "location_id" in df.columns
          assert "timestamp" in df.columns
          assert "us_aqi" in df.columns
          assert "target_aqi" in df.columns

          assert not df.empty

          print("FEATURE ARTIFACT RESTORE: PASS")
          PY

      # ======================================================
      # 6. RESTORE FEATURE DATASET + FEAST STORE
      # ======================================================

      - name: Restore feature state
        run: |

          mkdir -p data/processed
          mkdir -p feature_repo/feature_repo/data

          test -f \
            ".feature_restore/data/processed/aqi_features.parquet"

          cp \
            ".feature_restore/data/processed/aqi_features.parquet" \
            "data/processed/aqi_features.parquet"

          if [ -f ".feature_restore/feature_repo/feature_repo/data/registry.db" ]; then

            cp \
              ".feature_restore/feature_repo/feature_repo/data/registry.db" \
              "feature_repo/feature_repo/data/registry.db"

          fi

          if [ -f ".feature_restore/feature_repo/feature_repo/data/online_store.db" ]; then

            cp \
              ".feature_restore/feature_repo/feature_repo/data/online_store.db" \
              "feature_repo/feature_repo/data/online_store.db"

          fi

          ls -lh \
            data/processed/aqi_features.parquet

      # ======================================================
      # 7. APPLY FEAST
      # ======================================================

      - name: Apply Feast definitions
        working-directory: feature_repo/feature_repo
        run: |
          feast apply

      # ======================================================
      # 8. MATERIALIZE ONLINE FEATURES
      # ======================================================

      - name: Materialize latest Feast features
        working-directory: feature_repo/feature_repo
        run: |

          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%S")

          feast materialize-incremental \
            "$CURRENT_TIME"

      # ======================================================
      # 9. VERIFY FEAST SCHEMA + ONLINE STORE
      # ======================================================

      - name: Verify Feast
        run: |

          python - <<'PY'
          from feast import FeatureStore

          store = FeatureStore(
              repo_path="feature_repo/feature_repo"
          )

          views = store.list_feature_views()

          assert any(
              v.name == "aqi_features"
              for v in views
          )

          services = store.list_feature_services()

          assert any(
              s.name == "aqi_model_features"
              for s in services
          )

          features = [
              "aqi_features:temperature_2m",
              "aqi_features:pm2_5",
              "aqi_features:us_aqi",
          ]

          result = (
              store
              .get_online_features(
                  features=features,
                  entity_rows=[
                      {
                          "location_id":
                              "peshawar"
                      }
                  ],
              )
              .to_dict()
          )

          assert (
              result["location_id"][0]
              == "peshawar"
          )

          assert (
              result["us_aqi"][0]
              is not None
          )

          print("FEAST VERIFIED")
          print("FeatureView: aqi_features")
          print("FeatureService: aqi_model_features")
          print("Online us_aqi:", result["us_aqi"][0])
          PY

      
      # ======================================================
      # 10. RESTORE PREVIOUS MLFLOW REGISTRY
      # ======================================================

      - name: Restore previous MLflow registry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}

        run: |

          mkdir -p .mlflow_restore

          PREVIOUS_RUN=$(gh run list \
            --repo "$REPO" \
            --workflow "training_pipeline.yml" \
            --branch main \
            --status success \
            --limit 2 \
            --json databaseId \
            --jq '.[1].databaseId // empty')

          if [ -n "$PREVIOUS_RUN" ]; then

            echo "Restoring MLflow database from run $PREVIOUS_RUN"

            gh run download "$PREVIOUS_RUN" \
              --repo "$REPO" \
              --name pearls-aqi-mlflow-registry \
              --dir .mlflow_restore \
              || true

            if [ -f ".mlflow_restore/mlflow.db" ]; then

              cp \
                ".mlflow_restore/mlflow.db" \
                "mlflow.db"

              echo "MLflow database restored."

            fi

          else

            echo "No previous MLflow database found."

          fi
                

      # ======================================================
      # 11. TRAIN THROUGH FEAST
      # ======================================================

      - name: Run daily training pipeline
        run: |

          python src/models/train.py

      # ======================================================
      # 12. VERIFY CHAMPION
      # ======================================================

      - name: Verify MLflow champion
        run: |

          python - <<'PY'
          from pathlib import Path

          import mlflow
          from mlflow import MlflowClient

          root = Path.cwd()

          database = root / "mlflow.db"

          assert database.exists(), (
              f"MLflow database missing: {database}"
          )

          tracking_uri = (
              f"sqlite:///{database.as_posix()}"
          )

          mlflow.set_tracking_uri(
              tracking_uri
          )

          mlflow.set_registry_uri(
              tracking_uri
          )

          client = MlflowClient()

          MODEL_NAME = "Pearls_AQI_XGBoost"
          ALIAS = "champion"

          model = client.get_registered_model(
              MODEL_NAME
          )

          champion = (
              client.get_model_version_by_alias(
                  MODEL_NAME,
                  ALIAS,
              )
          )

          print("======================================")
          print("MLFLOW CHAMPION VERIFIED")
          print("======================================")
          print("Model:", MODEL_NAME)
          print("Champion version:", champion.version)
          print("Alias:", ALIAS)

          assert champion.version is not None

          PY

      # ======================================================
      # 13. VERIFY LOCAL MODEL
      # ======================================================

      - name: Verify local champion artifacts
        run: |

          test -f models/champion_model.pkl
          test -f models/champion_metadata.json

          python - <<'PY'
          import json

          path = (
              "models/champion_metadata.json"
          )

          with open(path, "r") as f:
              metadata = json.load(f)

          assert (
              metadata["feature_count"]
              == 70
          )

          assert (
              metadata["target"]
              == "target_aqi"
          )

          assert (
              "target_aqi"
              not in metadata["features"]
          )

          assert (
              "us_aqi"
              not in metadata["features"]
          )

          print(
              "LOCAL CHAMPION VERIFIED"
          )

          print(
              "Model:",
              metadata["model_type"],
          )

          print(
              "Features:",
              metadata["feature_count"],
          )

          print(
              "MLflow version:",
              metadata["mlflow_version"],
          )
          PY

      # ======================================================
      # 14. SAVE MLFLOW REGISTRY
      # ======================================================

      - name: Save MLflow model registry
        uses: actions/upload-artifact@v4
        with:
          name: pearls-aqi-mlflow-registry
          path: |
            mlflow.db
            mlartifacts/
            models/champion_metadata.json
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      # ======================================================
      # 15. SAVE CHAMPION MODEL
      # ======================================================

      - name: Save champion model
        uses: actions/upload-artifact@v4
        with:
          name: pearls-aqi-champion-model
          path: |
            models/champion_model.pkl
            models/champion_metadata.json
          retention-days: 30
          overwrite: true
          if-no-files-found: error