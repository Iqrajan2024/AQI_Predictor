name: Pearls AQI - Daily Training Pipeline

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "AQI Feature Pipeline"
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:

  train:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'schedule'
      )

    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v6

      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 4. VERIFY FEAST DEPENDENCIES
      # ============================================================
      - name: Verify Feast DuckDB dependencies
        run: |
          python -c "import feast; print('Feast:', feast.__version__)"
          python -c "import ibis; print('Ibis:', ibis.__version__)"
          python -c "import duckdb; print('DuckDB:', duckdb.__version__)"
          python -c "import pyarrow; print('PyArrow:', pyarrow.__version__)"
          python -c "import ibis.backends.duckdb; print('Ibis DuckDB backend: OK')"

      # ============================================================
      # 5. VERIFY FEAST SECRETS
      # ============================================================
      - name: Verify Feast secrets
        env:
          FEAST_POSTGRES_HOST: ${{ secrets.FEAST_POSTGRES_HOST }}
          FEAST_POSTGRES_PORT: ${{ secrets.FEAST_POSTGRES_PORT }}
          FEAST_POSTGRES_DATABASE: ${{ secrets.FEAST_POSTGRES_DATABASE }}
          FEAST_POSTGRES_SCHEMA: ${{ secrets.FEAST_POSTGRES_SCHEMA }}
          FEAST_POSTGRES_USER: ${{ secrets.FEAST_POSTGRES_USER }}
          FEAST_POSTGRES_PASSWORD: ${{ secrets.FEAST_POSTGRES_PASSWORD }}
          FEAST_POSTGRES_SSLMODE: ${{ secrets.FEAST_POSTGRES_SSLMODE }}
        run: |
          echo "============================================================"
          echo "VERIFYING FEAST SECRETS"
          echo "============================================================"

          check_secret() {
            NAME="$1"
            VALUE="$2"

            if [ -z "$VALUE" ]; then
              echo "ERROR: $NAME is EMPTY"
              return 1
            else
              echo "OK: $NAME is set"
              return 0
            fi
          }

          check_secret "FEAST_POSTGRES_HOST" "$FEAST_POSTGRES_HOST"
          check_secret "FEAST_POSTGRES_PORT" "$FEAST_POSTGRES_PORT"
          check_secret "FEAST_POSTGRES_DATABASE" "$FEAST_POSTGRES_DATABASE"
          check_secret "FEAST_POSTGRES_SCHEMA" "$FEAST_POSTGRES_SCHEMA"
          check_secret "FEAST_POSTGRES_USER" "$FEAST_POSTGRES_USER"
          check_secret "FEAST_POSTGRES_PASSWORD" "$FEAST_POSTGRES_PASSWORD"
          check_secret "FEAST_POSTGRES_SSLMODE" "$FEAST_POSTGRES_SSLMODE"

          echo
          echo "Feast secret verification completed."

      # ============================================================
      # 6. CONFIGURE CLOUD FEAST
      # ============================================================
      - name: Configure cloud Feast
        env:
          APP_ENV: cloud
          FEAST_POSTGRES_HOST: ${{ secrets.FEAST_POSTGRES_HOST }}
          FEAST_POSTGRES_PORT: ${{ secrets.FEAST_POSTGRES_PORT }}
          FEAST_POSTGRES_DATABASE: ${{ secrets.FEAST_POSTGRES_DATABASE }}
          FEAST_POSTGRES_SCHEMA: ${{ secrets.FEAST_POSTGRES_SCHEMA }}
          FEAST_POSTGRES_USER: ${{ secrets.FEAST_POSTGRES_USER }}
          FEAST_POSTGRES_PASSWORD: ${{ secrets.FEAST_POSTGRES_PASSWORD }}
          FEAST_POSTGRES_SSLMODE: ${{ secrets.FEAST_POSTGRES_SSLMODE }}
        run: |
          echo "============================================================"
          echo "CONFIGURING CLOUD FEAST"
          echo "============================================================"

          python scripts/configure_feast.py

          echo
          echo "Generated Feast configuration:"
          cat feature_repo/feature_repo/feature_store.yaml

      # ============================================================
      # 7. FIND FEATURE PIPELINE RUN
      # ============================================================
      - name: Find latest successful feature pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "============================================================"
          echo "FINDING LATEST SUCCESSFUL FEATURE PIPELINE"
          echo "============================================================"

          REPO="${{ github.repository }}"

          RUN_ID=$(gh run list \
            --repo "$REPO" \
            --workflow "feature_pipeline.yml" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "ERROR: No successful feature pipeline run found."
            exit 1
          fi

          echo "Latest successful feature pipeline run: $RUN_ID"
          echo "FEATURE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      # ============================================================
      # 8. DOWNLOAD FEATURE ARTIFACT
      # ============================================================
      - name: Download feature pipeline artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "============================================================"
          echo "DOWNLOADING FEATURE PIPELINE ARTIFACT"
          echo "============================================================"

          rm -rf feature_artifact
          mkdir -p feature_artifact

          gh run download "$FEATURE_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "aqi-pipeline-data" \
            --dir feature_artifact

          echo
          echo "Downloaded files:"
          find feature_artifact -type f -print

      # ============================================================
      # 9. RESTORE FEATURE DATASET
      # ============================================================
      - name: Restore feature dataset
        run: |
          echo "============================================================"
          echo "RESTORING FEATURE DATASET"
          echo "============================================================"

          mkdir -p data/processed

          echo "Downloaded artifact structure:"
          find feature_artifact -type f -print

          echo
          echo "Searching for aqi_features.parquet..."

          FEATURE_FILE=$(find feature_artifact \
            -type f \
            -name "aqi_features.parquet" \
            -print \
            -quit)

          if [ -z "$FEATURE_FILE" ]; then
            echo
            echo "ERROR: aqi_features.parquet was not found anywhere inside feature_artifact."
            echo
            echo "Available files:"
            find feature_artifact -type f -print
            exit 1
          fi

          echo
          echo "Feature parquet found:"
          echo "$FEATURE_FILE"

          cp "$FEATURE_FILE" data/processed/aqi_features.parquet

          echo
          echo "Feature dataset restored:"
          ls -lh data/processed/aqi_features.parquet

          echo
          echo "Removing local Feast databases..."

          find . -type f \( \
            -name "registry.db" \
            -o -name "online_store.db" \
          \) -print -delete

          echo
          echo "Verifying no local Feast databases remain..."

          if find . -type f \( \
            -name "registry.db" \
            -o -name "online_store.db" \
          \) -print -quit | grep -q .; then

            echo "ERROR: Local Feast database still exists."
            exit 1
          fi

          echo "OK: No local Feast databases found."
         

      # ============================================================
      # 10. VERIFY FEATURE DATASET
      # ============================================================
      - name: Verify feature dataset
        run: |
          echo "============================================================"
          echo "VERIFYING FEATURE DATASET"
          echo "============================================================"

          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path("data/processed/aqi_features.parquet")

          if not path.exists():
              raise SystemExit(
                  "ERROR: aqi_features.parquet does not exist."
              )

          df = pd.read_parquet(path)

          print(f"Rows: {len(df)}")
          print(f"Columns: {len(df.columns)}")

          required = {
              "location_id",
              "timestamp",
              "target_aqi",
              "us_aqi",
          }

          missing = required - set(df.columns)

          if missing:
              raise SystemExit(
                  f"ERROR: Missing required columns: {sorted(missing)}"
              )

          print("Required columns verified.")
          print("Feature dataset verification PASSED.")
          PY

      # ============================================================
      # 11. FEAST APPLY
      # ============================================================
      - name: Apply cloud Feast definitions
        working-directory: feature_repo/feature_repo
        env:
          APP_ENV: cloud
          FEAST_POSTGRES_HOST: ${{ secrets.FEAST_POSTGRES_HOST }}
          FEAST_POSTGRES_PORT: ${{ secrets.FEAST_POSTGRES_PORT }}
          FEAST_POSTGRES_DATABASE: ${{ secrets.FEAST_POSTGRES_DATABASE }}
          FEAST_POSTGRES_SCHEMA: ${{ secrets.FEAST_POSTGRES_SCHEMA }}
          FEAST_POSTGRES_USER: ${{ secrets.FEAST_POSTGRES_USER }}
          FEAST_POSTGRES_PASSWORD: ${{ secrets.FEAST_POSTGRES_PASSWORD }}
          FEAST_POSTGRES_SSLMODE: ${{ secrets.FEAST_POSTGRES_SSLMODE }}
        run: |
          echo "============================================================"
          echo "FEAST APPLY - CLOUD"
          echo "============================================================"

          feast apply

      # ============================================================
      # 12. MATERIALIZE CLOUD FEAST
      # ============================================================
      - name: Materialize cloud Feast
        working-directory: feature_repo/feature_repo
        env:
          APP_ENV: cloud
          FEAST_POSTGRES_HOST: ${{ secrets.FEAST_POSTGRES_HOST }}
          FEAST_POSTGRES_PORT: ${{ secrets.FEAST_POSTGRES_PORT }}
          FEAST_POSTGRES_DATABASE: ${{ secrets.FEAST_POSTGRES_DATABASE }}
          FEAST_POSTGRES_SCHEMA: ${{ secrets.FEAST_POSTGRES_SCHEMA }}
          FEAST_POSTGRES_USER: ${{ secrets.FEAST_POSTGRES_USER }}
          FEAST_POSTGRES_PASSWORD: ${{ secrets.FEAST_POSTGRES_PASSWORD }}
          FEAST_POSTGRES_SSLMODE: ${{ secrets.FEAST_POSTGRES_SSLMODE }}
        run: |
          echo "============================================================"
          echo "FEAST MATERIALIZE - CLOUD"
          echo "============================================================"

          END_TS=$(python -c "from datetime import datetime, timezone; print(datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S'))")

          echo "Materializing through: $END_TS"

          feast materialize-incremental "$END_TS"

      # ============================================================
      # 13. VERIFY CLOUD FEAST
      # ============================================================
      - name: Verify cloud Feast
        env:
          APP_ENV: cloud
          FEAST_POSTGRES_HOST: ${{ secrets.FEAST_POSTGRES_HOST }}
          FEAST_POSTGRES_PORT: ${{ secrets.FEAST_POSTGRES_PORT }}
          FEAST_POSTGRES_DATABASE: ${{ secrets.FEAST_POSTGRES_DATABASE }}
          FEAST_POSTGRES_SCHEMA: ${{ secrets.FEAST_POSTGRES_SCHEMA }}
          FEAST_POSTGRES_USER: ${{ secrets.FEAST_POSTGRES_USER }}
          FEAST_POSTGRES_PASSWORD: ${{ secrets.FEAST_POSTGRES_PASSWORD }}
          FEAST_POSTGRES_SSLMODE: ${{ secrets.FEAST_POSTGRES_SSLMODE }}
        run: |
          echo "============================================================"
          echo "VERIFYING CLOUD FEAST"
          echo "============================================================"

          python - <<'PY'
          from feast import FeatureStore

          FEATURE_REPO = "feature_repo/feature_repo"

          store = FeatureStore(repo_path=FEATURE_REPO)

          views = store.list_feature_views()
          services = store.list_feature_services()

          print("Feature views:")
          for view in views:
              print(" -", view.name)

          print()
          print("Feature services:")
          for service in services:
              print(" -", service.name)

          view_names = {v.name for v in views}
          service_names = {s.name for s in services}

          if "aqi_features" not in view_names:
              raise SystemExit(
                  "ERROR: aqi_features FeatureView not found."
              )

          if "aqi_model_features" not in service_names:
              raise SystemExit(
                  "ERROR: aqi_model_features FeatureService not found."
              )

          if "aqi_prediction_context" not in service_names:
              raise SystemExit(
                  "ERROR: aqi_prediction_context FeatureService not found."
              )

          model_service = store.get_feature_service(
              "aqi_model_features"
          )

          context_service = store.get_feature_service(
              "aqi_prediction_context"
          )

          model_features = [
              feature.name
              for projection in model_service.feature_view_projections
              for feature in projection.features
          ]

          context_features = [
              feature.name
              for projection in context_service.feature_view_projections
              for feature in projection.features
          ]

          print()
          print(f"Model features: {len(model_features)}")
          print(f"Context features: {len(context_features)}")

          if len(model_features) != 70:
              raise SystemExit(
                  f"ERROR: Expected 70 model features, "
                  f"got {len(model_features)}"
              )

          if len(context_features) != 71:
              raise SystemExit(
                  f"ERROR: Expected 71 context features, "
                  f"got {len(context_features)}"
              )

          if "us_aqi" in model_features:
              raise SystemExit(
                  "ERROR: us_aqi must NOT be a model input."
              )

          if "target_aqi" in model_features:
              raise SystemExit(
                  "ERROR: target_aqi must NOT be a model input."
              )

          if "us_aqi" not in context_features:
              raise SystemExit(
                  "ERROR: us_aqi missing from prediction context."
              )

          print()
          print("Feast feature contract verified.")
          print("70 model features: OK")
          print("71 prediction context features: OK")
          print("us_aqi excluded from model inputs: OK")
          print("target_aqi excluded from model inputs: OK")

          print()
          print("Testing cloud online store...")

          response = store.get_online_features(
              features=[
                  "aqi_features:temperature_2m",
                  "aqi_features:pm2_5",
                  "aqi_features:us_aqi",
              ],
              entity_rows=[
                  {
                      "location_id": "peshawar",
                  }
              ],
          ).to_dict()

          print(response)

          if "us_aqi" not in response:
              raise SystemExit(
                  "ERROR: us_aqi was not returned from online store."
              )

          print()
          print("Cloud Feast verification PASSED.")
          PY

      # ============================================================
      # 14. VERIFY DAGSHUB MLFLOW SECRETS
      # ============================================================
      - name: Verify DagsHub MLflow secrets
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          echo "============================================================"
          echo "VERIFYING DAGSHUB MLFLOW SECRETS"
          echo "============================================================"

          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            echo "ERROR: MLFLOW_TRACKING_URI is empty."
            exit 1
          fi

          if [ -z "$MLFLOW_TRACKING_USERNAME" ]; then
            echo "ERROR: MLFLOW_TRACKING_USERNAME is empty."
            exit 1
          fi

          if [ -z "$MLFLOW_TRACKING_PASSWORD" ]; then
            echo "ERROR: MLFLOW_TRACKING_PASSWORD is empty."
            exit 1
          fi

          echo "MLFLOW_TRACKING_URI: $MLFLOW_TRACKING_URI"
          echo "MLFLOW_TRACKING_USERNAME: $MLFLOW_TRACKING_USERNAME"
          echo "MLFLOW_TRACKING_PASSWORD: configured"

          if [[ "$MLFLOW_TRACKING_URI" == sqlite:* ]]; then
            echo "ERROR: SQLite MLflow is not allowed."
            exit 1
          fi

          if [[ "$MLFLOW_TRACKING_URI" == file:* ]]; then
            echo "ERROR: Local file MLflow is not allowed."
            exit 1
          fi

          echo
          echo "DagsHub MLflow secret verification PASSED."

      # ============================================================
      # 15. TEST DAGSHUB MLFLOW CONNECTION
      # ============================================================
      - name: Test DagsHub MLflow connection
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          echo "============================================================"
          echo "TESTING DAGSHUB MLFLOW CONNECTION"
          echo "============================================================"

          python - <<'PY'
          import os
          import mlflow

          mlflow.set_tracking_uri(
              os.environ["MLFLOW_TRACKING_URI"]
          )

          mlflow.set_registry_uri(
              os.environ["MLFLOW_TRACKING_URI"]
          )

          print("Tracking URI:")
          print(mlflow.get_tracking_uri())

          print()
          print("Registry URI:")
          print(mlflow.get_registry_uri())

          client = mlflow.MlflowClient()

          experiments = client.search_experiments(
              max_results=10
          )

          print()
          print("MLFLOW CONNECTION: OK")
          print(
              "Experiments accessible:",
              len(experiments)
          )
          PY

      # ============================================================
      # 16. RUN TRAINING
      # ============================================================
      - name: Run daily training pipeline
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          echo "============================================================"
          echo "RUNNING AQI TRAINING"
          echo "============================================================"

          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            echo "ERROR: Cloud MLflow URI is missing."
            exit 1
          fi

          if [ -z "$MLFLOW_TRACKING_USERNAME" ]; then
            echo "ERROR: Cloud MLflow username is missing."
            exit 1
          fi

          if [ -z "$MLFLOW_TRACKING_PASSWORD" ]; then
            echo "ERROR: Cloud MLflow password is missing."
            exit 1
          fi

          if [[ "$MLFLOW_TRACKING_URI" == sqlite:* ]]; then
            echo "ERROR: Training attempted to use local SQLite MLflow."
            exit 1
          fi

          if [[ "$MLFLOW_TRACKING_URI" == file:* ]]; then
            echo "ERROR: Training attempted to use local file MLflow."
            exit 1
          fi

          python src/models/train.py

      # ============================================================
      # 17. VERIFY CHAMPION MODEL IN CLOUD MLFLOW
      # ============================================================
      - name: Verify champion model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          echo "============================================================"
          echo "VERIFYING CHAMPION MODEL"
          echo "============================================================"

          python - <<'PY'
          import os
          import mlflow

          MODEL_NAME = "Pearls_AQI_XGBoost"
          MODEL_ALIAS = "champion"

          tracking_uri = os.environ.get(
              "MLFLOW_TRACKING_URI"
          )

          if not tracking_uri:
              raise SystemExit(
                  "ERROR: MLFLOW_TRACKING_URI is missing."
              )

          if tracking_uri.startswith("sqlite:"):
              raise SystemExit(
                  "ERROR: Champion verification is using SQLite."
              )

          if tracking_uri.startswith("file:"):
              raise SystemExit(
                  "ERROR: Champion verification is using local files."
              )

          mlflow.set_tracking_uri(tracking_uri)
          mlflow.set_registry_uri(tracking_uri)

          client = mlflow.MlflowClient()

          print("Tracking URI:")
          print(mlflow.get_tracking_uri())

          print()
          print("Registry URI:")
          print(mlflow.get_registry_uri())

          try:
              model_version = client.get_model_version_by_alias(
                  MODEL_NAME,
                  MODEL_ALIAS,
              )
          except Exception as exc:
              raise SystemExit(
                  "ERROR: Champion model alias not found "
                  "in cloud MLflow."
              ) from exc

          print()
          print("Champion model:")
          print(f"Name: {model_version.name}")
          print(f"Version: {model_version.version}")
          print(f"Run ID: {model_version.run_id}")
          print(f"Alias: {MODEL_ALIAS}")

          if model_version.name != MODEL_NAME:
              raise SystemExit(
                  "ERROR: Incorrect registered model."
              )

          if model_version.run_id is None:
              raise SystemExit(
                  "ERROR: Champion model has no run ID."
              )

          print()
          print("Champion model verification PASSED.")
          PY

      # ============================================================
      # 18. VERIFY LOCAL CHAMPION ARTIFACTS
      # ============================================================
      - name: Verify champion artifacts
        run: |
          echo "============================================================"
          echo "VERIFYING LOCAL CHAMPION ARTIFACTS"
          echo "============================================================"

          test -f models/champion_model.pkl
          test -f models/champion_metadata.json

          python - <<'PY'
          import json
          from pathlib import Path

          metadata_path = Path(
              "models/champion_metadata.json"
          )

          metadata = json.loads(
              metadata_path.read_text()
          )

          print(
              json.dumps(
                  metadata,
                  indent=2,
                  default=str,
              )
          )

          feature_count = metadata.get("feature_count")
          features = metadata.get("features", [])
          target = metadata.get("target")

          if feature_count != 70:
              raise SystemExit(
                  f"ERROR: Expected feature_count=70, "
                  f"got {feature_count}"
              )

          if len(features) != 70:
              raise SystemExit(
                  f"ERROR: Expected 70 features, "
                  f"got {len(features)}"
              )

          if target != "target_aqi":
              raise SystemExit(
                  f"ERROR: Expected target_aqi, got {target}"
              )

          if "target_aqi" in features:
              raise SystemExit(
                  "ERROR: target_aqi is present in model features."
              )

          if "us_aqi" in features:
              raise SystemExit(
                  "ERROR: us_aqi is present in model features."
              )

          print()
          print("Champion artifact verification PASSED.")
          PY

      # ============================================================
      # 19. RUN 72-HOUR FORECAST
      # ============================================================
      - name: Run 72-hour AQI forecast
        env:
          APP_ENV: cloud

          FEAST_POSTGRES_HOST: ${{ secrets.FEAST_POSTGRES_HOST }}
          FEAST_POSTGRES_PORT: ${{ secrets.FEAST_POSTGRES_PORT }}
          FEAST_POSTGRES_DATABASE: ${{ secrets.FEAST_POSTGRES_DATABASE }}
          FEAST_POSTGRES_SCHEMA: ${{ secrets.FEAST_POSTGRES_SCHEMA }}
          FEAST_POSTGRES_USER: ${{ secrets.FEAST_POSTGRES_USER }}
          FEAST_POSTGRES_PASSWORD: ${{ secrets.FEAST_POSTGRES_PASSWORD }}
          FEAST_POSTGRES_SSLMODE: ${{ secrets.FEAST_POSTGRES_SSLMODE }}

          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

          MLFLOW_MODEL_URI: "models:/Pearls_AQI_XGBoost@champion"

        run: |
          echo "============================================================"
          echo "RUNNING 72-HOUR AQI FORECAST"
          echo "============================================================"

          if [ -z "$FEAST_POSTGRES_HOST" ]; then
            echo "ERROR: FEAST_POSTGRES_HOST is missing."
            exit 1
          fi

          if [ -z "$FEAST_POSTGRES_PORT" ]; then
            echo "ERROR: FEAST_POSTGRES_PORT is missing."
            exit 1
          fi

          if [ -z "$FEAST_POSTGRES_DATABASE" ]; then
            echo "ERROR: FEAST_POSTGRES_DATABASE is missing."
            exit 1
          fi

          if [ -z "$FEAST_POSTGRES_SCHEMA" ]; then
            echo "ERROR: FEAST_POSTGRES_SCHEMA is missing."
            exit 1
          fi

          if [ -z "$FEAST_POSTGRES_USER" ]; then
            echo "ERROR: FEAST_POSTGRES_USER is missing."
            exit 1
          fi

          if [ -z "$FEAST_POSTGRES_PASSWORD" ]; then
            echo "ERROR: FEAST_POSTGRES_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$FEAST_POSTGRES_SSLMODE" ]; then
            echo "ERROR: FEAST_POSTGRES_SSLMODE is missing."
            exit 1
          fi

          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            echo "ERROR: MLFLOW_TRACKING_URI is missing."
            exit 1
          fi

          if [ -z "$MLFLOW_TRACKING_USERNAME" ]; then
            echo "ERROR: MLFLOW_TRACKING_USERNAME is missing."
            exit 1
          fi

          if [ -z "$MLFLOW_TRACKING_PASSWORD" ]; then
            echo "ERROR: MLFLOW_TRACKING_PASSWORD is missing."
            exit 1
          fi

          if [[ "$MLFLOW_TRACKING_URI" == sqlite:* ]]; then
            echo "ERROR: Forecast attempted to use local SQLite MLflow."
            exit 1
          fi

          if [[ "$MLFLOW_TRACKING_URI" == file:* ]]; then
            echo "ERROR: Forecast attempted to use local file MLflow."
            exit 1
          fi

          python src/prediction/predict.py

      # ============================================================
      # 20. VERIFY FORECAST OUTPUTS
      # ============================================================
      - name: Verify forecast outputs
        run: |
          echo "============================================================"
          echo "VERIFYING FORECAST OUTPUTS"
          echo "============================================================"

          test -f data/predictions/latest_forecast.csv
          test -f data/predictions/latest_daily_forecast.csv
          test -f data/predictions/latest_forecast_features.csv

          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          hourly_path = Path(
              "data/predictions/latest_forecast.csv"
          )

          daily_path = Path(
              "data/predictions/latest_daily_forecast.csv"
          )

          feature_path = Path(
              "data/predictions/latest_forecast_features.csv"
          )

          if not hourly_path.exists():
              raise SystemExit(
                  "ERROR: latest_forecast.csv was not generated."
              )

          if not daily_path.exists():
              raise SystemExit(
                  "ERROR: latest_daily_forecast.csv was not generated."
              )

          if not feature_path.exists():
              raise SystemExit(
                  "ERROR: latest_forecast_features.csv was not generated."
              )

          hourly = pd.read_csv(hourly_path)
          daily = pd.read_csv(daily_path)
          features = pd.read_csv(feature_path)

          print()
          print("Hourly forecast:")
          print("Rows:", len(hourly))
          print("Columns:", len(hourly.columns))

          print()
          print("Daily forecast:")
          print("Rows:", len(daily))
          print("Columns:", len(daily.columns))

          print()
          print("Forecast feature data:")
          print("Rows:", len(features))
          print("Columns:", len(features.columns))

          if len(hourly) != 72:
              raise SystemExit(
                  f"ERROR: Expected 72 hourly forecast rows, "
                  f"got {len(hourly)}"
              )

          if len(daily) != 3:
              raise SystemExit(
                  f"ERROR: Expected 3 daily forecast rows, "
                  f"got {len(daily)}"
              )

          if hourly.empty:
              raise SystemExit(
                  "ERROR: Hourly forecast is empty."
              )

          if daily.empty:
              raise SystemExit(
                  "ERROR: Daily forecast is empty."
              )

          print()
          print("72-hour forecast verification PASSED.")
          PY

          echo
          echo "Generated forecast files:"
          ls -lh data/predictions/latest_forecast.csv
          ls -lh data/predictions/latest_daily_forecast.csv
          ls -lh data/predictions/latest_forecast_features.csv

      # ============================================================
      # 21. UPLOAD CHAMPION ARTIFACTS
      # ============================================================
      - name: Upload champion model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aqi-champion-model
          path: |
            models/champion_model.pkl
            models/champion_metadata.json
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 22. UPLOAD FORECAST ARTIFACTS
      # ============================================================
      - name: Upload latest forecast artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aqi-latest-forecast
          path: |
            data/predictions/latest_forecast.csv
            data/predictions/latest_daily_forecast.csv
            data/predictions/latest_forecast_features.csv
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 23. FINAL CLOUD SEPARATION CHECK
      # ============================================================
      - name: Final cloud separation check
        run: |
          echo "============================================================"
          echo "FINAL CLOUD SEPARATION CHECK"
          echo "============================================================"

          if [ -f "mlflow.db" ]; then
            echo "WARNING: mlflow.db exists in workspace."
            echo "It will NOT be uploaded or used."
          fi

          if [ -d "mlartifacts" ]; then
            echo "WARNING: mlartifacts directory exists."
            echo "It will NOT be uploaded or used."
          fi

          if [ -f "feature_repo/feature_repo/data/registry.db" ]; then
            echo "ERROR: local Feast registry.db exists."
            exit 1
          fi

          if [ -f "feature_repo/feature_repo/data/online_store.db" ]; then
