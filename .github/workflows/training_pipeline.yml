name: Pearls AQI - Daily Training Pipeline

on:
  schedule:
    - cron: "30 2 * * *"

  workflow_dispatch:

jobs:

  training_pipeline:

    name: Train AQI Models

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ======================================================
      # 2. PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      # ======================================================
      # 3. DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy scikit-learn xgboost joblib feast mlflow


      # ======================================================
      # 4. FIND LATEST SUCCESSFUL FEATURE PIPELINE
      # ======================================================

      - name: Find latest successful feature pipeline run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}

        run: |

          RUN_ID=$(gh run list \
            --repo "$REPO" \
            --workflow "feature_pipeline.yml" \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: No successful feature pipeline run."
            exit 1
          fi

          echo "FEATURE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

          echo "Latest feature run: $RUN_ID"


      # ======================================================
      # 5. DOWNLOAD FEATURE ARTIFACT
      # ======================================================

      - name: Download latest feature artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FEATURE_RUN_ID: ${{ env.FEATURE_RUN_ID }}

        run: |

          mkdir -p .feature_restore

          gh run download "$FEATURE_RUN_ID" \
            --repo "$REPO" \
            --name aqi-pipeline-data \
            --dir .feature_restore

          find .feature_restore -type f -print


      # ======================================================
      # 6. RESTORE FEATURE DATASET
      # ======================================================

      - name: Restore feature dataset
        run: |

          SOURCE=".feature_restore/processed/aqi_features.parquet"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: Feature dataset missing."
            find .feature_restore -type f -print
            exit 1
          fi

          mkdir -p data/processed

          cp "$SOURCE" \
             data/processed/aqi_features.parquet

          echo "Feature dataset restored."


      # ======================================================
      # 7. COPY DATA INTO FEAST SOURCE LOCATION
      # ======================================================

      - name: Prepare Feast feature source
        run: |

          test -f data/processed/aqi_features.parquet

          echo "Feast source dataset ready."


      # ======================================================
      # 8. APPLY FEAST
      # ======================================================

      - name: Apply Feast definitions
        working-directory: feature_repo/feature_repo
        run: |

          feast apply


      # ======================================================
      # 9. VERIFY FEAST
      # ======================================================

      - name: Verify Feast FeatureView
        working-directory: feature_repo/feature_repo
        run: |

          python - <<'PY'
          from feast import FeatureStore

          store = FeatureStore(repo_path=".")

          views = store.list_feature_views()

          names = [v.name for v in views]

          assert "aqi_features" in names, names

          print("FEAST FEATURE VIEW VERIFIED")
          print(names)
          PY


      # ======================================================
      # 10. MATERIALIZE ONLINE FEATURES
      # ======================================================

      - name: Materialize Feast online features
        working-directory: feature_repo/feature_repo
        run: |

          feast materialize-incremental \
            "$(date -u +"%Y-%m-%dT%H:%M:%S")"


      # ======================================================
      # 11. VERIFY ONLINE STORE
      # ======================================================

      - name: Verify Feast online store
        working-directory: feature_repo/feature_repo
        run: |

          python - <<'PY'
          from feast import FeatureStore

          store = FeatureStore(repo_path=".")

          views = store.list_feature_views()

          assert any(
              v.name == "aqi_features"
              for v in views
          )

          print("FEAST ONLINE STORE READY")
          PY

      - name: Restore previous MLflow registry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |

          mkdir -p .mlflow_restore

          PREVIOUS_RUN=$(gh run list \
            --repo "$REPO" \
            --workflow "daily_training.yml" \
            --branch main \
            --status success \
            --limit 2 \
            --json databaseId \
            --jq '.[1].databaseId // empty')

          if [ -n "$PREVIOUS_RUN" ]; then

            echo "Restoring MLflow registry from run $PREVIOUS_RUN"

            gh run download "$PREVIOUS_RUN" \
              --repo "$REPO" \
              --name pearls-aqi-mlflow-registry \
              --dir .mlflow_restore \
              || true

            if [ -d ".mlflow_restore/mlruns" ]; then
              cp -r .mlflow_restore/mlruns .
            fi

          else

            echo "No previous MLflow registry found."
            echo "Creating initial registry."

          fi

          mkdir -p mlruns
      # ======================================================
      # 12. TRAIN THROUGH FEAST
      # ======================================================

      - name: Run daily training pipeline
        run: |

          python src/models/train.py


      # ======================================================
      # 13. VERIFY MLflow CHAMPION
      # ======================================================

      - name: Verify MLflow champion
        run: |

          python - <<'PY'
          from pathlib import Path

          import mlflow
          from mlflow import MlflowClient

          root = Path.cwd()

          mlflow.set_tracking_uri(
              (root / "mlruns").as_uri()
          )

          client = MlflowClient()

          model_name = "Pearls_AQI_XGBoost"

          model = client.get_registered_model(
              model_name
          )

          assert "champion" in model.aliases, (
              f"Champion alias missing: {model.aliases}"
          )

          champion_version = (
              model.aliases["champion"]
          )

          print("MLFLOW MODEL REGISTRY VERIFIED")
          print("Model:", model_name)
          print("Champion version:", champion_version)
          print("Aliases:", model.aliases)
          PY


      # ======================================================
      # 14. SAVE MODEL REGISTRY
      # ======================================================

      - name: Save MLflow model registry
        uses: actions/upload-artifact@v4
        with:
          name: pearls-aqi-mlflow-registry
          path: |
            mlruns/
            models/champion_metadata.json
          retention-days: 30
          overwrite: true