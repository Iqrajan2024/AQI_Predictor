          ):
              print(
                  f"{key} = {value}"
              )

          print()
          print("LATEST CHAMPION METRICS VERIFIED FROM DAGSHUB")
          PY

      # ============================================================
      # 18. VERIFY LOCAL CHAMPION ARTIFACTS
      # ============================================================
      - name: Verify champion artifacts
        run: |
          echo "============================================================"
          echo "VERIFYING LOCAL CHAMPION ARTIFACTS"
          echo "============================================================"

          test -f models/champion_model.pkl
          test -f models/champion_metadata.json

          python - <<'PY'
          import json
          from pathlib import Path

          metadata_path = Path(
              "models/champion_metadata.json"
          )

          metadata = json.loads(
              metadata_path.read_text()
          )

          print(
              json.dumps(
                  metadata,
                  indent=2,
                  default=str,
              )
          )

          feature_count = metadata.get("feature_count")
          features = metadata.get("features", [])
          target = metadata.get("target")

          if feature_count != 70:
              raise SystemExit(
                  f"ERROR: Expected feature_count=70, "
                  f"got {feature_count}"
              )

          if len(features) != 70:
              raise SystemExit(
                  f"ERROR: Expected 70 features, "
                  f"got {len(features)}"
              )

          if target != "target_aqi":
              raise SystemExit(
                  f"ERROR: Expected target_aqi, got {target}"
              )

          if "target_aqi" in features:
              raise SystemExit(
                  "ERROR: target_aqi is present in model features."
              )

          if "us_aqi" in features:
              raise SystemExit(
                  "ERROR: us_aqi is present in model features."
              )

          print()
          print("Champion artifact verification PASSED.")
          PY

      # ============================================================
      # 19. RUN 72-HOUR FORECAST
      # ============================================================
      - name: Run 72-hour AQI forecast
        env:
          APP_ENV: cloud

          FEAST_POSTGRES_HOST: ${{ secrets.FEAST_POSTGRES_HOST }}
          FEAST_POSTGRES_PORT: ${{ secrets.FEAST_POSTGRES_PORT }}
          FEAST_POSTGRES_DATABASE: ${{ secrets.FEAST_POSTGRES_DATABASE }}
          FEAST_POSTGRES_SCHEMA: ${{ secrets.FEAST_POSTGRES_SCHEMA }}
          FEAST_POSTGRES_USER: ${{ secrets.FEAST_POSTGRES_USER }}
          FEAST_POSTGRES_PASSWORD: ${{ secrets.FEAST_POSTGRES_PASSWORD }}
          FEAST_POSTGRES_SSLMODE: ${{ secrets.FEAST_POSTGRES_SSLMODE }}

          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

          MLFLOW_MODEL_URI: "models:/Pearls_AQI_XGBoost@champion"

        run: |
          echo "============================================================"
          echo "RUNNING 72-HOUR AQI FORECAST"
          echo "============================================================"

          if [ -z "$FEAST_POSTGRES_HOST" ]; then
            echo "ERROR: FEAST_POSTGRES_HOST is missing."
            exit 1
          fi

          if [ -z "$FEAST_POSTGRES_PORT" ]; then
            echo "ERROR: FEAST_POSTGRES_PORT is missing."
            exit 1
          fi

          if [ -z "$FEAST_POSTGRES_DATABASE" ]; then
            echo "ERROR: FEAST_POSTGRES_DATABASE is missing."
            exit 1
          fi

          if [ -z "$FEAST_POSTGRES_SCHEMA" ]; then
            echo "ERROR: FEAST_POSTGRES_SCHEMA is missing."
            exit 1
          fi

          if [ -z "$FEAST_POSTGRES_USER" ]; then
            echo "ERROR: FEAST_POSTGRES_USER is missing."
            exit 1
          fi

          if [ -z "$FEAST_POSTGRES_PASSWORD" ]; then
            echo "ERROR: FEAST_POSTGRES_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$FEAST_POSTGRES_SSLMODE" ]; then
            echo "ERROR: FEAST_POSTGRES_SSLMODE is missing."
            exit 1
          fi

          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            echo "ERROR: MLFLOW_TRACKING_URI is missing."
            exit 1
          fi

          if [ -z "$MLFLOW_TRACKING_USERNAME" ]; then
            echo "ERROR: MLFLOW_TRACKING_USERNAME is missing."
            exit 1
          fi

          if [ -z "$MLFLOW_TRACKING_PASSWORD" ]; then
            echo "ERROR: MLFLOW_TRACKING_PASSWORD is missing."
            exit 1
          fi

          if [[ "$MLFLOW_TRACKING_URI" == sqlite:* ]]; then
            echo "ERROR: Forecast attempted to use local SQLite MLflow."
            exit 1
          fi

          if [[ "$MLFLOW_TRACKING_URI" == file:* ]]; then
            echo "ERROR: Forecast attempted to use local file MLflow."
            exit 1
          fi

          python src/prediction/predict.py

      # ============================================================
      # 20. VERIFY FORECAST OUTPUTS
      # ============================================================
      - name: Verify forecast outputs
        run: |
          echo "============================================================"
          echo "VERIFYING FORECAST OUTPUTS"
          echo "============================================================"

          test -f data/predictions/latest_forecast.csv
          test -f data/predictions/latest_daily_forecast.csv
          test -f data/predictions/latest_forecast_features.csv

          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          hourly_path = Path(
              "data/predictions/latest_forecast.csv"
          )

          daily_path = Path(
              "data/predictions/latest_daily_forecast.csv"
          )

          feature_path = Path(
              "data/predictions/latest_forecast_features.csv"
          )

          if not hourly_path.exists():
              raise SystemExit(
                  "ERROR: latest_forecast.csv was not generated."
              )

          if not daily_path.exists():
              raise SystemExit(
                  "ERROR: latest_daily_forecast.csv was not generated."
              )

          if not feature_path.exists():
              raise SystemExit(
                  "ERROR: latest_forecast_features.csv was not generated."
              )

          hourly = pd.read_csv(hourly_path)
          daily = pd.read_csv(daily_path)
          features = pd.read_csv(feature_path)

          print()
          print("Hourly forecast:")
          print("Rows:", len(hourly))
          print("Columns:", len(hourly.columns))

          print()
          print("Daily forecast:")
          print("Rows:", len(daily))
          print("Columns:", len(daily.columns))

          print()
          print("Forecast feature data:")
          print("Rows:", len(features))
          print("Columns:", len(features.columns))

          if len(hourly) != 72:
              raise SystemExit(
                  f"ERROR: Expected 72 hourly forecast rows, "
                  f"got {len(hourly)}"
              )

          if len(daily) != 3:
              raise SystemExit(
                  f"ERROR: Expected 3 daily forecast rows, "
                  f"got {len(daily)}"
              )

          if hourly.empty:
              raise SystemExit(
                  "ERROR: Hourly forecast is empty."
              )

          if daily.empty:
              raise SystemExit(
                  "ERROR: Daily forecast is empty."
              )

          print()
          print("72-hour forecast verification PASSED.")
          PY

          echo
          echo "Generated forecast files:"
          ls -lh data/predictions/latest_forecast.csv
          ls -lh data/predictions/latest_daily_forecast.csv
          ls -lh data/predictions/latest_forecast_features.csv

      # ============================================================
      # 21. UPLOAD CHAMPION ARTIFACTS
      # ============================================================
      - name: Upload champion model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aqi-champion-model
          path: |
            models/champion_model.pkl
            models/champion_metadata.json
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 22. UPLOAD FORECAST ARTIFACTS
      # ============================================================
      - name: Upload latest forecast artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aqi-latest-forecast
          path: |
            data/predictions/latest_forecast.csv
            data/predictions/latest_daily_forecast.csv
            data/predictions/latest_forecast_features.csv
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 22.5. UPLOAD 72-HOUR EVALUATION ARTIFACTS
      # ============================================================
      - name: Upload 72-hour evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aqi-72h-evaluation
          path: |
            data/evaluation/historical_72h_forecasts.csv
            data/evaluation/historical_72h_daily_metrics.csv
            data/evaluation/historical_72h_summary.json
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 23. DEPLOY TO FASTAPI CLOUD
      # ============================================================
      - name: Deploy to FastAPI Cloud
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
        run: |
          echo "============================================================"
          echo "DEPLOYING TO FASTAPI CLOUD"
          echo "============================================================"

          if [ -z "$FASTAPI_CLOUD_TOKEN" ]; then
            echo "ERROR: FASTAPI_CLOUD_TOKEN is missing."
            exit 1
          fi

          if [ -z "$FASTAPI_CLOUD_APP_ID" ]; then
            echo "ERROR: FASTAPI_CLOUD_APP_ID is missing."
            exit 1
          fi

          echo
          echo "Checking forecast files before deployment..."

          test -f data/predictions/latest_forecast.csv
          test -f data/predictions/latest_daily_forecast.csv
          test -f data/predictions/latest_forecast_features.csv

          echo "Forecast files are present."

          echo
          echo "Installing uv..."

          python -m pip install uv

          echo
          echo "Checking FastAPI CLI..."

          uv run fastapi --version

          echo
          echo "Deploying current workspace to FastAPI Cloud..."

          uv run fastapi deploy

          echo
          echo "FastAPI Cloud deployment command completed."

      # ============================================================
      # 24. VERIFY ONLINE FASTAPI FORECAST
      # ============================================================
      - name: Verify online FastAPI forecast
        env:
          FASTAPI_BASE_URL: "https://pearls-aqi-predictor-3aece6f2.fastapicloud.dev"
        run: |
          echo "============================================================"
          echo "VERIFYING ONLINE FASTAPI FORECAST"
          echo "============================================================"

          python - <<'PY'
          import os
          import time
          import requests

          BASE_URL = os.environ["FASTAPI_BASE_URL"].rstrip("/")

          print(f"FastAPI URL: {BASE_URL}")
          print()

          print("Waiting for FastAPI Cloud instance...")

          health_ok = False

          for attempt in range(1, 7):
              try:
                  print(f"Health check attempt {attempt}/6...")

                  response = requests.get(
                      f"{BASE_URL}/health",
                      timeout=30,
                  )

                  print("Health status:", response.status_code)

                  if response.status_code == 200:
                      health_ok = True
                      print("/health: OK")
                      break

                  print(
                      "Health endpoint returned:",
                      response.text[:500]
                  )

              except requests.exceptions.RequestException as exc:
                  print(
                      "Health check failed:",
                      type(exc).__name__,
                      str(exc)
                  )

              if attempt < 6:
                  print(
                      "Waiting 15 seconds before retry..."
                  )
                  time.sleep(15)

          if not health_ok:
              raise SystemExit(
                  "ERROR: FastAPI Cloud /health did not become ready."
              )

          print()
          print("Checking /forecast...")

          response = requests.get(
              f"{BASE_URL}/forecast",
              timeout=120,
          )

          print("Forecast status:", response.status_code)

          if response.status_code != 200:
              print(response.text)
              raise SystemExit(
                  f"ERROR: /forecast returned {response.status_code}"
              )

          data = response.json()

          print()
          print("ONLINE FORECAST")
          print("Location:", data.get("location"))
          print("Forecast days:", data.get("forecast_days"))
          print("Forecast hours:", data.get("forecast_hours"))
          print("Model:", data.get("model"))
          print("Model alias:", data.get("model_alias"))

          daily = data.get("daily", [])
          hourly = data.get("hourly", [])

          print()
          print("Daily rows:", len(daily))
          print("Hourly rows:", len(hourly))

          if len(daily) != 3:
              raise SystemExit(
                  f"ERROR: Expected 3 daily rows, got {len(daily)}"
              )

          if len(hourly) != 72:
              raise SystemExit(
                  f"ERROR: Expected 72 hourly rows, got {len(hourly)}"
              )

          print()
          print("Daily forecast dates:")

          for row in daily:
              print(
                  row.get("date"),
                  "AQI:",
                  row.get("aqi"),
              )

          print()
          print("First hourly prediction:")
          print(hourly[0])

          print()
          print("Last hourly prediction:")
          print(hourly[-1])

          print()
          print("============================================================")
          print("ONLINE FASTAPI FORECAST VERIFICATION PASSED")
          print("============================================================")
          PY

      # ============================================================
      # 25. FINAL CLOUD SEPARATION CHECK
      # ============================================================
      - name: Final cloud separation check
        run: |
          echo "============================================================"
          echo "FINAL CLOUD SEPARATION CHECK"
          echo "============================================================"

          if [ -f "mlflow.db" ]; then
            echo "WARNING: mlflow.db exists in workspace."
            echo "It will NOT be uploaded or used."
          fi

          if [ -d "mlartifacts" ]; then
            echo "WARNING: mlartifacts directory exists."
            echo "It will NOT be uploaded or used."
          fi

          if [ -f "feature_repo/feature_repo/data/registry.db" ]; then
            echo "ERROR: local Feast registry.db exists."
            exit 1
          fi

          if [ -f "feature_repo/feature_repo/data/online_store.db" ]; then
            echo "ERROR: local Feast online_store.db exists."
            exit 1
          fi

          echo
          echo "============================================================"
          echo "CLOUD TRAINING + FORECAST + DEPLOYMENT PIPELINE PASSED"
          echo "============================================================"
          echo "Feast: Supabase/Postgres"
          echo "MLflow: DagsHub"
          echo "Training data: feature parquet artifact"
          echo "Model inputs: 70 features"
          echo "us_aqi: excluded from model inputs"
          echo "target_aqi: training target only"
          echo "Champion: cloud MLflow alias"
          echo "Evaluation: Day 1 + Day 2 + Day 3"
          echo "Persistence baseline: fixed-origin 72-hour"
          echo "Evaluation metrics: stored in champion MLflow run"
          echo "Forecast: 72 hourly predictions"
          echo "Daily forecast: 3 calendar days"
          echo "Forecast artifacts: uploaded"
          echo "FastAPI Cloud: deployed"
          echo "Online /forecast: verified"
          echo "Local Feast DB restoration: DISABLED"
          echo "Local MLflow restoration: DISABLED"
          echo "============================================================"