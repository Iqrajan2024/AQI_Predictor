name: Pearls AQI - Daily Training Pipeline

on:
  schedule:
    # 12:00 AM Pakistan Standard Time (PKT, UTC+5)
    # = 7:00 PM UTC on the previous day
    - cron: "0 19 * * *"

  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:

  train:

    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v6

      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 4. VERIFY FEAST DEPENDENCIES
      # ============================================================
      - name: Verify Feast DuckDB dependencies
        run: |
          python -c "import feast; print('Feast:', feast.__version__)"
          python -c "import ibis; print('Ibis:', ibis.__version__)"
          python -c "import duckdb; print('DuckDB:', duckdb.__version__)"
          python -c "import pyarrow; print('PyArrow:', pyarrow.__version__)"
          python -c "import ibis.backends.duckdb; print('Ibis DuckDB backend: OK')"

      # ============================================================
      # 5. VERIFY FEAST SECRETS
      # ============================================================
      - name: Verify Feast secrets
        env:
          FEAST_POSTGRES_HOST: ${{ secrets.FEAST_POSTGRES_HOST }}
          FEAST_POSTGRES_PORT: ${{ secrets.FEAST_POSTGRES_PORT }}
          FEAST_POSTGRES_DATABASE: ${{ secrets.FEAST_POSTGRES_DATABASE }}
          FEAST_POSTGRES_SCHEMA: ${{ secrets.FEAST_POSTGRES_SCHEMA }}
          FEAST_POSTGRES_USER: ${{ secrets.FEAST_POSTGRES_USER }}
          FEAST_POSTGRES_PASSWORD: ${{ secrets.FEAST_POSTGRES_PASSWORD }}
          FEAST_POSTGRES_SSLMODE: ${{ secrets.FEAST_POSTGRES_SSLMODE }}
        run: |
          echo "============================================================"
          echo "VERIFYING FEAST SECRETS"
          echo "============================================================"

          check_secret() {
            NAME="$1"
            VALUE="$2"

            if [ -z "$VALUE" ]; then
              echo "ERROR: $NAME is EMPTY"
              return 1
            else
              echo "OK: $NAME is set"
              return 0
            fi
          }

          check_secret "FEAST_POSTGRES_HOST" "$FEAST_POSTGRES_HOST"
          check_secret "FEAST_POSTGRES_PORT" "$FEAST_POSTGRES_PORT"
          check_secret "FEAST_POSTGRES_DATABASE" "$FEAST_POSTGRES_DATABASE"
          check_secret "FEAST_POSTGRES_SCHEMA" "$FEAST_POSTGRES_SCHEMA"
          check_secret "FEAST_POSTGRES_USER" "$FEAST_POSTGRES_USER"
          check_secret "FEAST_POSTGRES_PASSWORD" "$FEAST_POSTGRES_PASSWORD"
          check_secret "FEAST_POSTGRES_SSLMODE" "$FEAST_POSTGRES_SSLMODE"

          echo
          echo "Feast secret verification completed."

      # ============================================================
      # 6. CONFIGURE CLOUD FEAST
      # ============================================================
      - name: Configure cloud Feast
        env:
          APP_ENV: cloud
          FEAST_POSTGRES_HOST: ${{ secrets.FEAST_POSTGRES_HOST }}
          FEAST_POSTGRES_PORT: ${{ secrets.FEAST_POSTGRES_PORT }}
          FEAST_POSTGRES_DATABASE: ${{ secrets.FEAST_POSTGRES_DATABASE }}
          FEAST_POSTGRES_SCHEMA: ${{ secrets.FEAST_POSTGRES_SCHEMA }}
          FEAST_POSTGRES_USER: ${{ secrets.FEAST_POSTGRES_USER }}
          FEAST_POSTGRES_PASSWORD: ${{ secrets.FEAST_POSTGRES_PASSWORD }}
          FEAST_POSTGRES_SSLMODE: ${{ secrets.FEAST_POSTGRES_SSLMODE }}
        run: |
          echo "============================================================"
          echo "CONFIGURING CLOUD FEAST"
          echo "============================================================"

          python scripts/configure_feast.py

          echo
          echo "Generated Feast configuration:"
          cat feature_repo/feature_repo/feature_store.yaml

      # ============================================================
      # 7. FIND FEATURE PIPELINE RUN
      # ============================================================
      - name: Find latest successful feature pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "============================================================"
          echo "FINDING LATEST SUCCESSFUL FEATURE PIPELINE"
          echo "============================================================"

          REPO="${{ github.repository }}"

          RUN_ID=$(gh run list \
            --repo "$REPO" \
            --workflow "feature_pipeline.yml" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "ERROR: No successful feature pipeline run found."
            exit 1
          fi

          echo "Latest successful feature pipeline run: $RUN_ID"
          echo "FEATURE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      # ============================================================
      # 8. DOWNLOAD FEATURE ARTIFACT
      # ============================================================
      - name: Download feature pipeline artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "============================================================"
          echo "DOWNLOADING FEATURE PIPELINE ARTIFACT"
          echo "============================================================"

          rm -rf feature_artifact
          mkdir -p feature_artifact

          gh run download "$FEATURE_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "aqi-pipeline-data" \
            --dir feature_artifact

          echo
          echo "Downloaded files:"
          find feature_artifact -type f -print

      # ============================================================
      # 9. RESTORE FEATURE DATASET
      # ============================================================
      - name: Restore feature dataset
        run: |
          echo "============================================================"
          echo "RESTORING FEATURE DATASET"
          echo "============================================================"

          mkdir -p data/processed

          echo "Downloaded artifact structure:"
          find feature_artifact -type f -print

          echo
          echo "Searching for aqi_features.parquet..."

          FEATURE_FILE=$(find feature_artifact \
            -type f \
            -name "aqi_features.parquet" \
            -print \
            -quit)

          if [ -z "$FEATURE_FILE" ]; then
            echo
            echo "ERROR: aqi_features.parquet was not found anywhere inside feature_artifact."
            echo
            echo "Available files:"
            find feature_artifact -type f -print
            exit 1
          fi

          echo
          echo "Feature parquet found:"
          echo "$FEATURE_FILE"

          cp "$FEATURE_FILE" data/processed/aqi_features.parquet

          echo
          echo "Feature dataset restored:"
          ls -lh data/processed/aqi_features.parquet

          echo
          echo "Removing local Feast databases..."

          find . -type f \( \
            -name "registry.db" \
            -o -name "online_store.db" \
          \) -print -delete

          echo
          echo "Verifying no local Feast databases remain..."

          if find . -type f \( \
            -name "registry.db" \
            -o -name "online_store.db" \
          \) -print -quit | grep -q .; then

            echo "ERROR: Local Feast database still exists."
            exit 1
          fi

          echo "OK: No local Feast databases found."

      # ============================================================
      # 10. VERIFY FEATURE DATASET
      # ============================================================
      - name: Verify feature dataset
        run: |
          echo "============================================================"
          echo "VERIFYING FEATURE DATASET"
          echo "============================================================"

          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path("data/processed/aqi_features.parquet")

          if not path.exists():
              raise SystemExit(
                  "ERROR: aqi_features.parquet does not exist."
              )

          df = pd.read_parquet(path)

          print(f"Rows: {len(df)}")
          print(f"Columns: {len(df.columns)}")

          required = {
              "location_id",
              "timestamp",
              "target_aqi",
              "us_aqi",
          }

          missing = required - set(df.columns)

          if missing:
              raise SystemExit(
                  f"ERROR: Missing required columns: {sorted(missing)}"
              )

          print("Required columns verified.")
          print("Feature dataset verification PASSED.")
          PY

      # ============================================================
      # 11. FEAST APPLY
      # ============================================================
      - name: Apply cloud Feast definitions
        working-directory: feature_repo/feature_repo
        env:
          APP_ENV: cloud
          FEAST_POSTGRES_HOST: ${{ secrets.FEAST_POSTGRES_HOST }}
          FEAST_POSTGRES_PORT: ${{ secrets.FEAST_POSTGRES_PORT }}
          FEAST_POSTGRES_DATABASE: ${{ secrets.FEAST_POSTGRES_DATABASE }}
          FEAST_POSTGRES_SCHEMA: ${{ secrets.FEAST_POSTGRES_SCHEMA }}
          FEAST_POSTGRES_USER: ${{ secrets.FEAST_POSTGRES_USER }}
          FEAST_POSTGRES_PASSWORD: ${{ secrets.FEAST_POSTGRES_PASSWORD }}
          FEAST_POSTGRES_SSLMODE: ${{ secrets.FEAST_POSTGRES_SSLMODE }}
        run: |
          echo "============================================================"
          echo "FEAST APPLY - CLOUD"
          echo "============================================================"

          feast apply

      # ============================================================
      # 12. MATERIALIZE CLOUD FEAST
      # ============================================================
      - name: Materialize cloud Feast
        working-directory: feature_repo/feature_repo
        env:
          APP_ENV: cloud
          FEAST_POSTGRES_HOST: ${{ secrets.FEAST_POSTGRES_HOST }}
          FEAST_POSTGRES_PORT: ${{ secrets.FEAST_POSTGRES_PORT }}
          FEAST_POSTGRES_DATABASE: ${{ secrets.FEAST_POSTGRES_DATABASE }}
          FEAST_POSTGRES_SCHEMA: ${{ secrets.FEAST_POSTGRES_SCHEMA }}
          FEAST_POSTGRES_USER: ${{ secrets.FEAST_POSTGRES_USER }}
          FEAST_POSTGRES_PASSWORD: ${{ secrets.FEAST_POSTGRES_PASSWORD }}
          FEAST_POSTGRES_SSLMODE: ${{ secrets.FEAST_POSTGRES_SSLMODE }}
        run: |
          echo "============================================================"
          echo "FEAST MATERIALIZE - CLOUD"
          echo "============================================================"

          END_TS=$(python -c "from datetime import datetime, timezone; print(datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S'))")

          echo "Materializing through: $END_TS"

          feast materialize-incremental "$END_TS"

      # ============================================================
      # 13. VERIFY CLOUD FEAST
      # ============================================================
      - name: Verify cloud Feast
        env:
          APP_ENV: cloud
          FEAST_POSTGRES_HOST: ${{ secrets.FEAST_POSTGRES_HOST }}
          FEAST_POSTGRES_PORT: ${{ secrets.FEAST_POSTGRES_PORT }}
          FEAST_POSTGRES_DATABASE: ${{ secrets.FEAST_POSTGRES_DATABASE }}
          FEAST_POSTGRES_SCHEMA: ${{ secrets.FEAST_POSTGRES_SCHEMA }}
          FEAST_POSTGRES_USER: ${{ secrets.FEAST_POSTGRES_USER }}
          FEAST_POSTGRES_PASSWORD: ${{ secrets.FEAST_POSTGRES_PASSWORD }}
          FEAST_POSTGRES_SSLMODE: ${{ secrets.FEAST_POSTGRES_SSLMODE }}
        run: |
          echo "============================================================"
          echo "VERIFYING CLOUD FEAST"
          echo "============================================================"

          python - <<'PY'
          from feast import FeatureStore

          FEATURE_REPO = "feature_repo/feature_repo"

          store = FeatureStore(repo_path=FEATURE_REPO)

          views = store.list_feature_views()
          services = store.list_feature_services()

          print("Feature views:")
          for view in views:
              print(" -", view.name)

          print()
          print("Feature services:")
          for service in services:
              print(" -", service.name)

          view_names = {v.name for v in views}
          service_names = {s.name for s in services}

          if "aqi_features" not in view_names:
              raise SystemExit(
                  "ERROR: aqi_features FeatureView not found."
              )

          if "aqi_model_features" not in service_names:
              raise SystemExit(
                  "ERROR: aqi_model_features FeatureService not found."
              )

          if "aqi_prediction_context" not in service_names:
              raise SystemExit(
                  "ERROR: aqi_prediction_context FeatureService not found."
              )

          model_service = store.get_feature_service(
              "aqi_model_features"
          )

          context_service = store.get_feature_service(
              "aqi_prediction_context"
          )

          model_features = [
              feature.name
              for projection in model_service.feature_view_projections
              for feature in projection.features
          ]

          context_features = [
              feature.name
              for projection in context_service.feature_view_projections
              for feature in projection.features
          ]

          print()
          print(f"Model features: {len(model_features)}")
          print(f"Context features: {len(context_features)}")

          if len(model_features) != 70:
              raise SystemExit(
                  f"ERROR: Expected 70 model features, "
                  f"got {len(model_features)}"
              )

          if len(context_features) != 71:
              raise SystemExit(
                  f"ERROR: Expected 71 context features, "
                  f"got {len(context_features)}"
              )

          if "us_aqi" in model_features:
              raise SystemExit(
                  "ERROR: us_aqi must NOT be a model input."
              )

          if "target_aqi" in model_features:
              raise SystemExit(
                  "ERROR: target_aqi must NOT be a model input."
              )

          if "us_aqi" not in context_features:
              raise SystemExit(
                  "ERROR: us_aqi missing from prediction context."
              )

          print()
          print("Feast feature contract verified.")
          print("70 model features: OK")
          print("71 prediction context features: OK")
          print("us_aqi excluded from model inputs: OK")
          print("target_aqi excluded from model inputs: OK")

          print()
          print("Testing cloud online store...")

          response = store.get_online_features(
              features=[
                  "aqi_features:temperature_2m",
                  "aqi_features:pm2_5",
                  "aqi_features:us_aqi",
              ],
              entity_rows=[
                  {
                      "location_id": "peshawar",
                  }
              ],
          ).to_dict()

          print(response)

          if "us_aqi" not in response:
              raise SystemExit(
                  "ERROR: us_aqi was not returned from online store."
              )

          print()
          print("Cloud Feast verification PASSED.")
          PY

      # ============================================================
      # 14. VERIFY DAGSHUB MLFLOW SECRETS
      # ============================================================
      - name: Verify DagsHub MLflow secrets
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          echo "============================================================"
          echo "VERIFYING DAGSHUB MLFLOW SECRETS"
          echo "============================================================"

          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            echo "ERROR: MLFLOW_TRACKING_URI is empty."
            exit 1
          fi

          if [ -z "$MLFLOW_TRACKING_USERNAME" ]; then
            echo "ERROR: MLFLOW_TRACKING_USERNAME is empty."
            exit 1
          fi

          if [ -z "$MLFLOW_TRACKING_PASSWORD" ]; then
            echo "ERROR: MLFLOW_TRACKING_PASSWORD is empty."
            exit 1
          fi

          echo "MLFLOW_TRACKING_URI: $MLFLOW_TRACKING_URI"
          echo "MLFLOW_TRACKING_USERNAME: $MLFLOW_TRACKING_USERNAME"
          echo "MLFLOW_TRACKING_PASSWORD: configured"

          if [[ "$MLFLOW_TRACKING_URI" == sqlite:* ]]; then
            echo "ERROR: SQLite MLflow is not allowed."
            exit 1
          fi

          if [[ "$MLFLOW_TRACKING_URI" == file:* ]]; then
            echo "ERROR: Local file MLflow is not allowed."
            exit 1
          fi

          echo
          echo "DagsHub MLflow secret verification PASSED."

      # ============================================================
      # 15. TEST DAGSHUB MLFLOW CONNECTION
      # ============================================================
      - name: Test DagsHub MLflow connection
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          echo "============================================================"
          echo "TESTING DAGSHUB MLFLOW CONNECTION"
          echo "============================================================"

          python - <<'PY'
          import os
          import mlflow
          from mlflow import MlflowClient

          tracking_uri = os.environ["MLFLOW_TRACKING_URI"].strip()

          if not tracking_uri:
              raise SystemExit(
                  "ERROR: MLFLOW_TRACKING_URI is empty."
              )

          if tracking_uri.startswith("sqlite:"):
              raise SystemExit(
                  "ERROR: SQLite MLflow is not allowed."
              )

          if tracking_uri.startswith("file:"):
              raise SystemExit(
                  "ERROR: Local file MLflow is not allowed."
              )

          # IMPORTANT:
          # Both tracking and registry MUST use DagsHub.
          mlflow.set_tracking_uri(tracking_uri)
          mlflow.set_registry_uri(tracking_uri)

          print("Tracking URI:")
          print(mlflow.get_tracking_uri())

          print()
          print("Registry URI:")
          print(mlflow.get_registry_uri())

          client = MlflowClient(
              tracking_uri=tracking_uri,
              registry_uri=tracking_uri,
          )

          experiments = client.search_experiments(
              max_results=10
          )

          print()
          print("MLFLOW CONNECTION: OK")
          print(
              "Experiments accessible:",
              len(experiments)
          )
          PY

      # ============================================================
      # 16. RUN TRAINING
      # ============================================================
      - name: Run daily training pipeline
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          echo "============================================================"
          echo "RUNNING AQI TRAINING"
          echo "============================================================"

          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            echo "ERROR: Cloud MLflow URI is missing."
            exit 1
          fi

          if [ -z "$MLFLOW_TRACKING_USERNAME" ]; then
            echo "ERROR: Cloud MLflow username is missing."
            exit 1
          fi

          if [ -z "$MLFLOW_TRACKING_PASSWORD" ]; then
            echo "ERROR: Cloud MLflow password is missing."
            exit 1
          fi

          if [[ "$MLFLOW_TRACKING_URI" == sqlite:* ]]; then
            echo "ERROR: Training attempted to use local SQLite MLflow."
            exit 1
          fi

          if [[ "$MLFLOW_TRACKING_URI" == file:* ]]; then
            echo "ERROR: Training attempted to use local file MLflow."
            exit 1
          fi

          python src/models/train.py

      # ============================================================
      # 16.5. RUN HISTORICAL 72-HOUR EVALUATION
      # ============================================================
      - name: Evaluate new champion over historical 72-hour horizons
        env:
          # --------------------------------------------------------
          # IMPORTANT:
          # The evaluation script MUST receive the same DagsHub
          # MLflow credentials used by training.
          # --------------------------------------------------------
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

          APP_ENV: cloud

        run: |
          echo "============================================================"
          echo "RUNNING HISTORICAL 72-HOUR CHAMPION EVALUATION"
          echo "============================================================"

          # --------------------------------------------------------
          # VERIFY CLOUD MLFLOW BEFORE SPENDING TIME ON EVALUATION
          # --------------------------------------------------------

          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            echo "ERROR: MLFLOW_TRACKING_URI is missing."
            exit 1
          fi

          if [ -z "$MLFLOW_TRACKING_USERNAME" ]; then
            echo "ERROR: MLFLOW_TRACKING_USERNAME is missing."
            exit 1
          fi

          if [ -z "$MLFLOW_TRACKING_PASSWORD" ]; then
            echo "ERROR: MLFLOW_TRACKING_PASSWORD is missing."
            exit 1
          fi

          if [[ "$MLFLOW_TRACKING_URI" == sqlite:* ]]; then
            echo "ERROR: Evaluation attempted to use local SQLite MLflow."
            exit 1
          fi

          if [[ "$MLFLOW_TRACKING_URI" == file:* ]]; then
            echo "ERROR: Evaluation attempted to use local file MLflow."
            exit 1
          fi

          echo
          echo "DagsHub MLflow URI:"
          echo "$MLFLOW_TRACKING_URI"

          echo
          echo "Champion model:"
          ls -lh models/champion_model.pkl

          echo
          echo "Running recursive 72-hour evaluation..."

          python src/evaluation/evaluate_72h.py

          echo
          echo "Evaluation completed."

          echo
          echo "Evaluation files:"
          find data/evaluation -maxdepth 1 -type f -print

          test -f data/evaluation/historical_72h_forecasts.csv
          test -f data/evaluation/historical_72h_daily_metrics.csv
          test -f data/evaluation/historical_72h_summary.json

          echo
          echo "72-hour evaluation artifacts verified."

      # ============================================================
      # 16.6. LOG DAILY + PERSISTENCE METRICS TO CHAMPION RUN
      # ============================================================
      - name: Log 72-hour evaluation metrics to champion MLflow run
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          echo "============================================================"
          echo "LOGGING 72-HOUR EVALUATION METRICS TO CHAMPION RUN"
          echo "============================================================"

          python - <<'PY'
          import os
          from pathlib import Path

          import mlflow
          import numpy as np
          import pandas as pd
          from sklearn.metrics import r2_score
          from mlflow import MlflowClient


          # ========================================================
          # CONFIGURATION
          # ========================================================

          MODEL_NAME = "Pearls_AQI_XGBoost"
          MODEL_ALIAS = "champion"

          DAILY_FILE = Path(
              "data/evaluation/historical_72h_daily_metrics.csv"
          )

          FORECAST_FILE = Path(
              "data/evaluation/historical_72h_forecasts.csv"
          )

          SUMMARY_FILE = Path(
              "data/evaluation/historical_72h_summary.json"
          )


          # ========================================================
          # 1. CONFIGURE DAGSHUB MLFLOW
          # ========================================================

          tracking_uri = os.environ.get(
              "MLFLOW_TRACKING_URI",
              ""
          ).strip()

          username = os.environ.get(
              "MLFLOW_TRACKING_USERNAME",
              ""
          ).strip()

          password = os.environ.get(
              "MLFLOW_TRACKING_PASSWORD",
              ""
          ).strip()


          if not tracking_uri:
              raise SystemExit(
                  "ERROR: MLFLOW_TRACKING_URI is empty."
              )

          if not username:
              raise SystemExit(
                  "ERROR: MLFLOW_TRACKING_USERNAME is empty."
              )

          if not password:
              raise SystemExit(
                  "ERROR: MLFLOW_TRACKING_PASSWORD is empty."
              )


          # --------------------------------------------------------
          # NEVER allow local MLflow
          # --------------------------------------------------------

          lowered_uri = tracking_uri.lower()

          if lowered_uri.startswith("sqlite:"):
              raise SystemExit(
                  "ERROR: Evaluation attempted to use SQLite MLflow."
              )

          if lowered_uri.startswith("file:"):
              raise SystemExit(
                  "ERROR: Evaluation attempted to use local file MLflow."
              )

          if "mlruns" in lowered_uri:
              raise SystemExit(
                  "ERROR: Evaluation attempted to use local mlruns storage."
              )


          # --------------------------------------------------------
          # Configure MLflow authentication
          # --------------------------------------------------------

          os.environ["MLFLOW_TRACKING_USERNAME"] = username
          os.environ["MLFLOW_TRACKING_PASSWORD"] = password


          # --------------------------------------------------------
          # IMPORTANT:
          # Explicitly use the SAME DagsHub URI for BOTH:
          #
          # 1. Tracking server
          # 2. Model registry
          #
          # This prevents MLflow from silently creating/using
          # a local SQLAlchemy/SQLite registry.
          # --------------------------------------------------------

          mlflow.set_tracking_uri(tracking_uri)
          mlflow.set_registry_uri(tracking_uri)


          print()
          print("============================================================")
          print("DAGSHUB MLFLOW CONFIGURATION")
          print("============================================================")

          print(
              "Tracking URI:",
              mlflow.get_tracking_uri()
          )

          print(
              "Registry URI:",
              mlflow.get_registry_uri()
          )


          client = MlflowClient(
              tracking_uri=tracking_uri,
              registry_uri=tracking_uri,
          )


          # ========================================================
          # 2. VERIFY REMOTE REGISTERED MODEL
          # ========================================================

          print()
          print("============================================================")
          print("VERIFYING DAGSHUB MODEL REGISTRY")
          print("============================================================")

          try:
              registered_model = client.get_registered_model(
                  MODEL_NAME
              )
          except Exception as exc:
              raise SystemExit(
                  "ERROR: Registered model "
                  f"'{MODEL_NAME}' was not found in DagsHub MLflow. "
                  "The evaluation is not connected to the same "
                  "MLflow registry used by training."
              ) from exc


          print(
              "Registered model:",
              registered_model.name
          )


          # ========================================================
          # 3. GET CURRENT CHAMPION ALIAS
          # ========================================================

          try:
              champion = client.get_model_version_by_alias(
                  name=MODEL_NAME,
                  alias=MODEL_ALIAS,
              )
          except Exception as exc:
              raise SystemExit(
                  "ERROR: Champion alias was not found for "
                  f"'{MODEL_NAME}' in DagsHub MLflow."
              ) from exc


          if not champion.run_id:
              raise SystemExit(
                  "ERROR: Champion model has no MLflow run_id."
              )


          run_id = champion.run_id


          print()
          print("============================================================")
          print("CURRENT DAGSHUB CHAMPION")
          print("============================================================")

          print("Model:", MODEL_NAME)
          print("Version:", champion.version)
          print("Alias:", MODEL_ALIAS)
          print("Run ID:", run_id)


          # ========================================================
          # 4. LOAD EVALUATION DATA
          # ========================================================

          if not DAILY_FILE.exists():
              raise SystemExit(
                  f"ERROR: Missing evaluation file: {DAILY_FILE}"
              )

          if not FORECAST_FILE.exists():
              raise SystemExit(
                  f"ERROR: Missing forecast file: {FORECAST_FILE}"
              )

          if not SUMMARY_FILE.exists():
              raise SystemExit(
                  f"ERROR: Missing evaluation summary: {SUMMARY_FILE}"
              )


          daily = pd.read_csv(DAILY_FILE)
          forecasts = pd.read_csv(FORECAST_FILE)


          if daily.empty:
              raise SystemExit(
                  "ERROR: Daily evaluation file is empty."
              )

          if forecasts.empty:
              raise SystemExit(
                  "ERROR: Historical forecast file is empty."
              )


          # ========================================================
          # 5. VALIDATE FORECAST COLUMNS
          # ========================================================

          required_columns = {
              "lead_hour",
              "actual_aqi",
              "predicted_aqi",
              "persistence_aqi",
          }

          missing = required_columns - set(
              forecasts.columns
          )

          if missing:
              raise SystemExit(
                  "ERROR: Historical forecast file is missing: "
                  + ", ".join(sorted(missing))
              )


          # ========================================================
          # 6. CALCULATE DAY 1 / DAY 2 / DAY 3
          # ========================================================

          metrics_to_log = {}


          for day in [1, 2, 3]:

              start_hour = ((day - 1) * 24) + 1
              end_hour = day * 24


              subset = forecasts[
                  forecasts["lead_hour"].between(
                      start_hour,
                      end_hour
                  )
              ].copy()


              if subset.empty:
                  raise SystemExit(
                      f"ERROR: No evaluation rows for Day {day}."
                  )


              actual = subset["actual_aqi"].astype(float)
              predicted = subset["predicted_aqi"].astype(float)
              persistence = subset["persistence_aqi"].astype(float)


              # ----------------------------------------------------
              # MODEL METRICS
              # ----------------------------------------------------

              day_rmse = float(
                  np.sqrt(
                      np.mean(
                          (actual - predicted) ** 2
                      )
                  )
              )


              day_mae = float(
                  np.mean(
                      np.abs(actual - predicted)
                  )
              )


              day_r2 = float(
                  r2_score(
                      actual,
                      predicted
                  )
              )


              # ----------------------------------------------------
              # PERSISTENCE METRICS
              # ----------------------------------------------------

              persistence_rmse = float(
                  np.sqrt(
                      np.mean(
                          (actual - persistence) ** 2
                      )
                  )
              )


              persistence_mae = float(
                  np.mean(
                      np.abs(actual - persistence)
                  )
              )


              persistence_r2 = float(
                  r2_score(
                      actual,
                      persistence
                  )
              )


              # ----------------------------------------------------
              # IMPROVEMENT VS PERSISTENCE
              # ----------------------------------------------------

              if persistence_rmse == 0:
                  rmse_improvement = 0.0
              else:
                  rmse_improvement = (
                      (
                          persistence_rmse
                          - day_rmse
                      )
                      / persistence_rmse
                  ) * 100.0


              if persistence_mae == 0:
                  mae_improvement = 0.0
              else:
                  mae_improvement = (
                      (
                          persistence_mae
                          - day_mae
                      )
                      / persistence_mae
                  ) * 100.0


              # ----------------------------------------------------
              # MLflow NAMES
              # ----------------------------------------------------

              metrics_to_log.update({

                  f"day{day}_rmse":
                      day_rmse,

                  f"day{day}_mae":
                      day_mae,

                  f"day{day}_r2":
                      day_r2,

                  f"day{day}_persistence_rmse":
                      persistence_rmse,

                  f"day{day}_persistence_mae":
                      persistence_mae,

                  f"day{day}_persistence_r2":
                      persistence_r2,

                  f"day{day}_rmse_improvement_vs_persistence_pct":
                      rmse_improvement,

                  f"day{day}_mae_improvement_vs_persistence_pct":
                      mae_improvement,
              })


              print()
              print(
                  f"================ DAY {day} "
                  f"({start_hour}-{end_hour}) ================"
              )

              print(
                  f"Model RMSE:        {day_rmse:.6f}"
              )

              print(
                  f"Model MAE:         {day_mae:.6f}"
              )

              print(
                  f"Model R2:          {day_r2:.6f}"
              )

              print(
                  f"Persistence RMSE:  "
                  f"{persistence_rmse:.6f}"
              )

              print(
                  f"Persistence MAE:   "
                  f"{persistence_mae:.6f}"
              )

              print(
                  f"Persistence R2:    "
                  f"{persistence_r2:.6f}"
              )

              print(
                  f"RMSE Improvement:  "
                  f"{rmse_improvement:.2f}%"
              )

              print(
                  f"MAE Improvement:   "
                  f"{mae_improvement:.2f}%"
              )


          # ========================================================
          # 7. OVERALL 72-HOUR METRICS
          # ========================================================

          actual = forecasts["actual_aqi"].astype(float)
          predicted = forecasts["predicted_aqi"].astype(float)
          persistence = forecasts["persistence_aqi"].astype(float)


          overall_rmse = float(
              np.sqrt(
                  np.mean(
                      (actual - predicted) ** 2
                  )
              )
          )


          overall_mae = float(
              np.mean(
                  np.abs(actual - predicted)
              )
          )


          overall_r2 = float(
              r2_score(
                  actual,
                  predicted
              )
          )


          persistence_rmse = float(
              np.sqrt(
                  np.mean(
                      (actual - persistence) ** 2
                  )
              )
          )


          persistence_mae = float(
              np.mean(
                  np.abs(actual - persistence)
              )
          )


          persistence_r2 = float(
              r2_score(
                  actual,
                  persistence
              )
          )


          if persistence_rmse == 0:
              overall_rmse_improvement = 0.0
          else:
              overall_rmse_improvement = (
                  (
                      persistence_rmse
                      - overall_rmse
                  )
                  / persistence_rmse
              ) * 100.0


          if persistence_mae == 0:
              overall_mae_improvement = 0.0
          else:
              overall_mae_improvement = (
                  (
                      persistence_mae
                      - overall_mae
                  )
                  / persistence_mae
              ) * 100.0


          metrics_to_log.update({

              "72h_rmse":
                  overall_rmse,

              "72h_mae":
                  overall_mae,

              "72h_r2":
                  overall_r2,

              "72h_persistence_rmse":
                  persistence_rmse,

              "72h_persistence_mae":
                  persistence_mae,

              "72h_persistence_r2":
                  persistence_r2,

              "72h_rmse_improvement_vs_persistence_pct":
                  overall_rmse_improvement,

              "72h_mae_improvement_vs_persistence_pct":
                  overall_mae_improvement,
          })


          # ========================================================
          # 8. GET EXACT CHAMPION RUN
          # ========================================================

          run = client.get_run(run_id)


          print()
          print("============================================================")
          print("LOGGING METRICS TO EXISTING CHAMPION RUN")
          print("============================================================")

          print(
              "Existing run metrics:",
              len(run.data.metrics)
          )


          # ========================================================
          # 9. LOG ALL METRICS IN ONE BATCH
          # ========================================================

          timestamp_ms = int(
              pd.Timestamp.now(
                  tz="UTC"
              ).timestamp() * 1000
          )


          mlflow_metrics = []


          for name, value in metrics_to_log.items():

              if not np.isfinite(value):
                  raise SystemExit(
                      f"ERROR: Non-finite metric: "
                      f"{name}={value}"
                  )


              mlflow_metrics.append(
                  mlflow.entities.Metric(
                      key=name,
                      value=float(value),
                      timestamp=timestamp_ms,
                      step=0,
                  )
              )


          client.log_batch(
              run_id=run_id,
              metrics=mlflow_metrics,
          )


          print(
              f"Logged {len(mlflow_metrics)} metrics "
              "to champion run."
          )


          # ========================================================
          # 10. LOG EVALUATION PARAMETERS
          # ========================================================

          client.log_batch(
              run_id=run_id,
              params=[
                  mlflow.entities.Param(
                      key="evaluation_type",
                      value="historical_72_hour_recursive",
                  ),

                  mlflow.entities.Param(
                      key="evaluation_horizon_hours",
                      value="72",
                  ),

                  mlflow.entities.Param(
                      key="evaluation_day_1_hours",
                      value="1-24",
                  ),

                  mlflow.entities.Param(
                      key="evaluation_day_2_hours",
                      value="25-48",
                  ),

                  mlflow.entities.Param(
                      key="evaluation_day_3_hours",
                      value="49-72",
                  ),

                  mlflow.entities.Param(
                      key="persistence_baseline",
                      value="fixed_origin_72_hour",
                  ),
              ],
          )


          # ========================================================
          # 11. LOG EVALUATION ARTIFACTS
          # ========================================================

          client.log_artifact(
              run_id,
              str(DAILY_FILE),
              artifact_path="evaluation",
          )


          client.log_artifact(
              run_id,
              str(FORECAST_FILE),
              artifact_path="evaluation",
          )


          client.log_artifact(
              run_id,
              str(SUMMARY_FILE),
              artifact_path="evaluation",
          )


          # ========================================================
          # 12. TAG CHAMPION VERSION
          # ========================================================

          client.set_model_version_tag(
              MODEL_NAME,
              str(champion.version),
              "evaluation_status",
              "PASSED",
          )


          client.set_model_version_tag(
              MODEL_NAME,
              str(champion.version),
              "evaluation_type",
              "historical_72_hour_recursive",
          )


          client.set_model_version_tag(
              MODEL_NAME,
              str(champion.version),
              "day1_rmse",
              str(metrics_to_log["day1_rmse"]),
          )


          client.set_model_version_tag(
              MODEL_NAME,
              str(champion.version),
              "day2_rmse",
              str(metrics_to_log["day2_rmse"]),
          )


          client.set_model_version_tag(
              MODEL_NAME,
              str(champion.version),
              "day3_rmse",
              str(metrics_to_log["day3_rmse"]),
          )


          # ========================================================
          # 13. RE-READ FROM DAGSHUB AND VERIFY
          # ========================================================

          verified_run = client.get_run(run_id)

          verified_metrics = verified_run.data.metrics


          required_metrics = [

              # Day 1
              "day1_rmse",
              "day1_mae",
              "day1_r2",
              "day1_persistence_rmse",
              "day1_persistence_mae",
              "day1_persistence_r2",
              "day1_rmse_improvement_vs_persistence_pct",
              "day1_mae_improvement_vs_persistence_pct",

              # Day 2
              "day2_rmse",
              "day2_mae",
              "day2_r2",
              "day2_persistence_rmse",
              "day2_persistence_mae",
              "day2_persistence_r2",
              "day2_rmse_improvement_vs_persistence_pct",
              "day2_mae_improvement_vs_persistence_pct",

              # Day 3
              "day3_rmse",
              "day3_mae",
              "day3_r2",
              "day3_persistence_rmse",
              "day3_persistence_mae",
              "day3_persistence_r2",
              "day3_rmse_improvement_vs_persistence_pct",
              "day3_mae_improvement_vs_persistence_pct",

              # Overall
              "72h_rmse",
              "72h_mae",
              "72h_r2",
              "72h_persistence_rmse",
              "72h_persistence_mae",
              "72h_persistence_r2",
              "72h_rmse_improvement_vs_persistence_pct",
              "72h_mae_improvement_vs_persistence_pct",
          ]


          missing_metrics = [
              name
              for name in required_metrics
              if name not in verified_metrics
          ]


          if missing_metrics:
              raise SystemExit(
                  "ERROR: Metrics were not successfully "
                  "stored in DagsHub champion run: "
                  + ", ".join(missing_metrics)
              )


          # ========================================================
          # 14. PRINT VERIFIED METRICS
          # ========================================================

          print()
          print("============================================================")
          print("DAGSHUB MLflow 72-HOUR EVALUATION PASSED")
          print("============================================================")

          print()
          print("Model:", MODEL_NAME)
          print("Champion version:", champion.version)
          print("Champion alias:", MODEL_ALIAS)
          print("Champion run:", run_id)


          for day in [1, 2, 3]:

              print()
              print(f"DAY {day}")

              print(
                  "  RMSE:",
                  verified_metrics[
                      f"day{day}_rmse"
                  ]
              )

              print(
                  "  MAE:",
                  verified_metrics[
                      f"day{day}_mae"
                  ]
              )

              print(
                  "  R2:",
                  verified_metrics[
                      f"day{day}_r2"
                  ]
              )

              print(
                  "  Persistence RMSE:",
                  verified_metrics[
                      f"day{day}_persistence_rmse"
                  ]
              )

              print(
                  "  Persistence MAE:",
                  verified_metrics[
                      f"day{day}_persistence_mae"
                  ]
              )

              print(
                  "  Persistence R2:",
                  verified_metrics[
                      f"day{day}_persistence_r2"
                  ]
              )

              print(
                  "  RMSE Improvement:",
                  verified_metrics[
                      f"day{day}_rmse_improvement_vs_persistence_pct"
                  ]
              )

              print(
                  "  MAE Improvement:",
                  verified_metrics[
                      f"day{day}_mae_improvement_vs_persistence_pct"
                  ]
              )


          print()
          print("72-HOUR OVERALL")

          print(
              "  RMSE:",
              verified_metrics["72h_rmse"]
          )

          print(
              "  MAE:",
              verified_metrics["72h_mae"]
          )

          print(
              "  R2:",
              verified_metrics["72h_r2"]
          )

          print(
              "  Persistence RMSE:",
              verified_metrics["72h_persistence_rmse"]
          )

          print(
              "  Persistence MAE:",
              verified_metrics["72h_persistence_mae"]
          )

          print(
              "  Persistence R2:",
              verified_metrics["72h_persistence_r2"]
          )

          print(
              "  RMSE Improvement:",
              verified_metrics[
                  "72h_rmse_improvement_vs_persistence_pct"
              ]
          )

          print(
              "  MAE Improvement:",
              verified_metrics[
                  "72h_mae_improvement_vs_persistence_pct"
              ]
          )


          print()
          print(
              "ALL DAY 1 + DAY 2 + DAY 3 + "
              "PERSISTENCE + IMPROVEMENT METRICS "
              "ARE STORED IN THE DAGSHUB CHAMPION RUN."
          )

          print("============================================================")
          PY

      # ============================================================
      # 17. VERIFY CHAMPION MODEL + CHAMPION METRICS IN DAGSHUB
      # ============================================================
      - name: Verify champion model and metrics
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          echo "============================================================"
          echo "VERIFYING CHAMPION MODEL + METRICS IN DAGSHUB MLFLOW"
          echo "============================================================"

          python - <<'PY'
          import os
          import mlflow
          from mlflow import MlflowClient

          MODEL_NAME = "Pearls_AQI_XGBoost"
          MODEL_ALIAS = "champion"

          tracking_uri = os.environ["MLFLOW_TRACKING_URI"]

          if tracking_uri.startswith("sqlite:"):
              raise SystemExit(
                  "ERROR: Champion verification is using SQLite."
              )

          if tracking_uri.startswith("file:"):
              raise SystemExit(
                  "ERROR: Champion verification is using local files."
              )

          mlflow.set_tracking_uri(tracking_uri)
          mlflow.set_registry_uri(tracking_uri)

          client = MlflowClient(
              tracking_uri=tracking_uri,
              registry_uri=tracking_uri,
          )

          print("Tracking URI:")
          print(mlflow.get_tracking_uri())

          print()
          print("Registry URI:")
          print(mlflow.get_registry_uri())

          # --------------------------------------------------------
          # GET CURRENT CHAMPION
          # --------------------------------------------------------

          try:
              champion = client.get_model_version_by_alias(
                  MODEL_NAME,
                  MODEL_ALIAS,
              )
          except Exception as exc:
              raise SystemExit(
                  "ERROR: Champion alias was not found in DagsHub MLflow."
              ) from exc

          if not champion.run_id:
              raise SystemExit(
                  "ERROR: Champion model version has no run_id."
              )

          print()
          print("============================================================")
          print("CHAMPION MODEL")
          print("============================================================")
          print("Model:", champion.name)
          print("Version:", champion.version)
          print("Alias:", MODEL_ALIAS)
          print("Run ID:", champion.run_id)

          # --------------------------------------------------------
          # GET THE RUN THAT PRODUCED THE CHAMPION
          # --------------------------------------------------------

          run = client.get_run(champion.run_id)

          metrics = run.data.metrics
          params = run.data.params

          print()
          print("============================================================")
          print("CHAMPION METRICS")
          print("============================================================")

          required_metrics = [
              "validation_rmse",
              "validation_mae",
              "validation_r2",
              "test_rmse",
              "test_mae",
              "test_r2",
          ]

          found_metrics = {}

          for metric_name in required_metrics:
              if metric_name in metrics:
                  found_metrics[metric_name] = metrics[metric_name]
                  print(
                      f"{metric_name}: "
                      f"{metrics[metric_name]:.6f}"
                  )

          # --------------------------------------------------------
          # REQUIRE CORE METRICS
          # --------------------------------------------------------

          required_core_metrics = [
              "validation_rmse",
              "validation_mae",
              "validation_r2",
          ]

          missing = [
              name
              for name in required_core_metrics
              if name not in metrics
          ]

          if missing:
              raise SystemExit(
                  "ERROR: Champion run is missing required metrics: "
                  + ", ".join(missing)
              )

          # --------------------------------------------------------
          # VERIFY MODEL TYPE
          # --------------------------------------------------------

          model_name = params.get("model_name")

          print()
          print("Champion model:", model_name)

          if model_name is None:
              raise SystemExit(
                  "ERROR: Champion run is missing 'model_name' parameter."
              )

          if model_name.strip().lower() != "xgboost":
              raise SystemExit(
                  f"ERROR: Expected XGBoost champion, got {model_name}"
              )

          # --------------------------------------------------------
          # COPY METRICS TO MODEL VERSION TAGS
          # --------------------------------------------------------

          for metric_name, metric_value in found_metrics.items():
              client.set_model_version_tag(
                  MODEL_NAME,
                  str(champion.version),
                  metric_name,
                  str(metric_value),
              )

          client.set_model_version_tag(
              MODEL_NAME,
              str(champion.version),
              "champion_run_id",
              champion.run_id,
          )

          client.set_model_version_tag(
              MODEL_NAME,
              str(champion.version),
              "champion_status",
              "champion",
          )

          print()
          print("Champion model version tags updated.")

          # --------------------------------------------------------
          # RE-READ CHAMPION TO VERIFY TAGS
          # --------------------------------------------------------

          verified = client.get_model_version(
              MODEL_NAME,
              str(champion.version),
          )

          print()
          print("============================================================")
          print("REGISTERED CHAMPION METRICS")
          print("============================================================")

          for metric_name in required_core_metrics:
              value = verified.tags.get(metric_name)

              if value is None:
                  raise SystemExit(
                      f"ERROR: Metric tag '{metric_name}' "
                      "was not registered on champion."
                  )

              print(f"{metric_name}: {value}")

          print()
          print("============================================================")
          print("CHAMPION + METRICS VERIFICATION PASSED")
          print("============================================================")
          print("Model:", MODEL_NAME)
          print("Version:", champion.version)
          print("Alias:", MODEL_ALIAS)
          print("Run ID:", champion.run_id)
          print("Validation RMSE:", metrics["validation_rmse"])
          print("Validation MAE:", metrics["validation_mae"])
          print("Validation R2:", metrics["validation_r2"])
          print("============================================================")
          PY

      # ============================================================
      # 17.5. PRINT LATEST CHAMPION METRICS
      # ============================================================
      - name: Print latest champion metrics
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          echo "============================================================"
          echo "LATEST DAGSHUB CHAMPION METRICS"
          echo "============================================================"

          python - <<'PY'
