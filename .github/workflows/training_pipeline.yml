name: Pearls AQI - Daily Training Pipeline

on:
  schedule:
    # Every day at 02:30 UTC
    - cron: "30 2 * * *"

  workflow_dispatch:

jobs:
  training_pipeline:

    name: Train AQI Models
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ======================================================
      # 2. PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      # ======================================================
      # 3. INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy scikit-learn xgboost joblib


      # ======================================================
      # 4. FIND LATEST SUCCESSFUL FEATURE PIPELINE RUN
      # ======================================================

      - name: Find latest successful feature pipeline run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}

        run: |

          echo "Finding latest successful feature pipeline run..."

          RUN_ID=$(gh run list \
            --repo "$REPO" \
            --workflow "feature_pipeline.yml" \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: No successful feature pipeline run found."
            exit 1
          fi

          echo "Latest successful feature pipeline run:"
          echo "$RUN_ID"

          echo "FEATURE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"


      # ======================================================
      # 5. DOWNLOAD LATEST FEATURE ARTIFACT
      # ======================================================

      - name: Download latest feature pipeline artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FEATURE_RUN_ID: ${{ env.FEATURE_RUN_ID }}

        run: |

          echo "Downloading artifact from feature pipeline run:"
          echo "$FEATURE_RUN_ID"

          mkdir -p .feature_restore

          gh run download "$FEATURE_RUN_ID" \
            --repo "$REPO" \
            --name aqi-pipeline-data \
            --dir .feature_restore

          echo ""
          echo "Downloaded artifact contents:"
          find .feature_restore -type f -print


      # ======================================================
      # 6. RESTORE FEATURE DATASET
      # ======================================================

      - name: Restore feature dataset
        run: |

          echo "Restoring feature dataset..."

          mkdir -p data/processed

          FEATURE_SOURCE=".feature_restore/data/processed/aqi_features.parquet"

          if [ ! -f "$FEATURE_SOURCE" ]; then
            echo "ERROR: Feature dataset not found."
            echo ""
            echo "Available files:"
            find .feature_restore -type f -print
            exit 1
          fi

          cp "$FEATURE_SOURCE" \
             "data/processed/aqi_features.parquet"

          echo ""
          echo "Feature dataset restored:"
          ls -lh data/processed/aqi_features.parquet


      # ======================================================
      # 7. VERIFY FEATURE DATASET
      # ======================================================

      - name: Verify feature dataset
        run: |

          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path(
              "data/processed/aqi_features.parquet"
          )

          assert path.exists(), (
              f"Feature dataset missing: {path}"
          )

          df = pd.read_parquet(path)

          assert not df.empty, (
              "Feature dataset is empty."
          )

          assert "timestamp" in df.columns, (
              "timestamp column missing."
          )

          assert "us_aqi" in df.columns, (
              "us_aqi column missing."
          )

          assert "target_aqi" in df.columns, (
              "target_aqi column missing."
          )

          print("======================================")
          print("FEATURE DATASET READY FOR TRAINING")
          print("======================================")
          print("Shape:", df.shape)
          print("First timestamp:", df["timestamp"].min())
          print("Last timestamp:", df["timestamp"].max())
          print("Columns:", len(df.columns))
          print("Missing values:", df.isna().sum().sum())
          PY


      # ======================================================
      # 8. RUN DAILY MODEL TRAINING
      # ======================================================

      - name: Run daily training pipeline
        run: |
          python src/models/train.py


      # ======================================================
      # 9. VERIFY CHAMPION MODEL
      # ======================================================

      - name: Verify champion model
        run: |

          test -f models/champion_model.pkl

          test -f models/champion_metadata.json

          echo "======================================"
          echo "CHAMPION MODEL VERIFIED"
          echo "======================================"

          ls -lh \
            models/champion_model.pkl \
            models/champion_metadata.json