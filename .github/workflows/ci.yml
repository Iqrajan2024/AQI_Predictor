name: Pearls AQI - CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:


jobs:

  test:
    name: Test Feature Pipeline

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ======================================================
      # 2. SETUP PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      # ======================================================
      # 3. INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests pytest


      # ======================================================
      # 4. CREATE/UPDATE RAW DATASET
      #
      # CI needs raw data before feature engineering.
      # ======================================================

      - name: Create raw dataset
        run: |
          python src/data/update_raw_dataset.py


      # ======================================================
      # 5. BUILD FEATURE DATASET
      #
      # This creates:
      #
      # data/processed/aqi_features.parquet
      # ======================================================

      - name: Build feature dataset
        run: |
          python src/features/build_features.py


      # ======================================================
      # 6. VERIFY FEATURE FILE EXISTS
      # ======================================================

      - name: Verify feature dataset exists
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("data/processed/aqi_features.parquet")

          print("Checking:", path.resolve())

          assert path.exists(), (
              f"Feature dataset was not created: {path.resolve()}"
          )

          print("Feature dataset exists.")
          print("Size:", path.stat().st_size, "bytes")
          PY


      # ======================================================
      # 7. RUN FEATURE TESTS
      # ======================================================

      - name: Run feature tests
        run: |
          pytest tests/test_features.py -v