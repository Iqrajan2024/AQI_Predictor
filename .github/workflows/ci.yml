name: Pearls AQI - CI

on:

  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:


jobs:

  test:

    name: Test AQI Project

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ======================================================
      # 2. SETUP PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      # ======================================================
      # 3. INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install pandas
          pip install pyarrow
          pip install requests
          pip install pytest
          pip install feast


      # ======================================================
      # 4. VERIFY FEAST INSTALLATION
      # ======================================================

      - name: Verify Feast installation
        run: |
          python -c "import feast; print('Feast version:', feast.__version__)"


      # ======================================================
      # 5. RUN ALL TESTS
      # ======================================================

      - name: Run tests
        run: |
          pytest -q