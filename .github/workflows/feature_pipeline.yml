name: Pearls AQI - Hourly Feature Pipeline

on:
  schedule:
    # Every hour at minute 15
    - cron: "15 * * * *"

  workflow_dispatch:

jobs:
  feature_pipeline:
    name: Run Feature Engineering
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # --------------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # --------------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyarrow

      # --------------------------------------------------------
      # 4. Generate raw Open-Meteo dataset
      # --------------------------------------------------------
      - name: Download raw Open-Meteo dataset
        run: |
          python src/data/historical_backfill.py

      # --------------------------------------------------------
      # 5. Verify raw dataset
      # --------------------------------------------------------
      - name: Verify raw dataset
        run: |
          python -c "import pandas as pd; p='data/raw/peshawar_openmeteo_2024_2026.csv'; df=pd.read_csv(p); print('Raw dataset exists:', __import__('os').path.exists(p)); print('Raw dataset shape:', df.shape); print('Missing values:', df.isna().sum().sum()); print('Duplicate timestamps:', df['timestamp'].duplicated().sum())"

      # --------------------------------------------------------
      # 6. Run feature engineering
      # --------------------------------------------------------
      - name: Run feature engineering pipeline
        run: |
          python src/features/build_features.py

      # --------------------------------------------------------
      # 7. Verify feature dataset
      # --------------------------------------------------------
      - name: Verify feature dataset
        run: |
          python -c "import pandas as pd; p='data/processed/aqi_features.parquet'; df=pd.read_parquet(p); print('Feature dataset exists:', __import__('os').path.exists(p)); print('Feature dataset shape:', df.shape); print('Missing values:', df.isna().sum().sum()); print('Columns:', df.columns.tolist())"