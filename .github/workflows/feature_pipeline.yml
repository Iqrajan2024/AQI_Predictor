name: Pearls AQI - Hourly Feature Pipeline

on:
  schedule:
    - cron: "15 * * * *"

  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:

  feature_pipeline:

    name: Run Incremental Feature Pipeline

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests pytest "feast[duckdb]==0.66.0" duckdb

      # ======================================================
      # RESTORE PREVIOUS PIPELINE STATE
      # ======================================================

      - name: Restore latest pipeline artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}

        run: |

          RUN_ID=$(gh run list \
            --repo "$REPO" \
            --workflow "feature_pipeline.yml" \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "No previous successful feature run."
            echo "Initial backfill will be performed."
            exit 0
          fi

          echo "Previous feature run: $RUN_ID"

          mkdir -p .pipeline_restore

          gh run download "$RUN_ID" \
            --repo "$REPO" \
            --name aqi-pipeline-data \
            --dir .pipeline_restore

          find .pipeline_restore -type f -print

      # ======================================================
      # RESTORE DATA
      # ======================================================

      - name: Restore pipeline files
        run: |

          mkdir -p data/raw
          mkdir -p data/processed
          mkdir -p feature_repo/feature_repo/data

          if [ -f ".pipeline_restore/data/raw/peshawar_openmeteo_2024_2026.csv" ]; then
            cp \
              ".pipeline_restore/data/raw/peshawar_openmeteo_2024_2026.csv" \
              "data/raw/peshawar_openmeteo_2024_2026.csv"
          fi

          if [ -f ".pipeline_restore/data/processed/aqi_features.parquet" ]; then
            cp \
              ".pipeline_restore/data/processed/aqi_features.parquet" \
              "data/processed/aqi_features.parquet"
          fi


         

      # ======================================================
      # UPDATE RAW
      # ======================================================

      - name: Update raw Open-Meteo dataset
        run: |
          python src/data/update_raw_dataset.py

      # ======================================================
      # VERIFY RAW
      # ======================================================

      - name: Verify raw dataset
        run: |

          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path(
              "data/raw/peshawar_openmeteo_2024_2026.csv"
          )

          assert path.exists()
          df = pd.read_csv(path)

          assert not df.empty
          assert "timestamp" in df.columns

          print("RAW DATASET VERIFIED")
          print("Shape:", df.shape)
          print("First:", df["timestamp"].min())
          print("Last:", df["timestamp"].max())
          PY

      # ======================================================
      # BUILD FEATURES
      # ======================================================

      - name: Run feature engineering
        run: |
          python src/features/build_features.py

      # ======================================================
      # VERIFY FEATURE DATASET
      # ======================================================

      - name: Verify feature dataset
        run: |

          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path(
              "data/processed/aqi_features.parquet"
          )

          assert path.exists()

          df = pd.read_parquet(path)

          required = [
              "location_id",
              "timestamp",
              "us_aqi",
              "target_aqi",
          ]

          for col in required:
              assert col in df.columns, col

          assert not df.empty

          assert df["location_id"].notna().all()
          assert df["us_aqi"].notna().all()

          print("FEATURE DATASET VERIFIED")
          print("Shape:", df.shape)
          print("Columns:", len(df.columns))
          print("First:", df["timestamp"].min())
          print("Last:", df["timestamp"].max())
          print("Missing:", df.isna().sum().sum())
          PY
      

      # ======================================================
      # RESET FEAST LOCAL INFRASTRUCTURE
      # ======================================================

      - name: Reset Feast local state
        working-directory: feature_repo/feature_repo
        run: |
          rm -f data/registry.db
          rm -f data/online_store.db

          echo "Feast local state reset."
          ls -la data || true    
        

      - name: Verify Feast source definitions
        working-directory: feature_repo/feature_repo
        run: |
          echo "======================================"
          echo "FEAST PYTHON FILES"
          echo "======================================"

          find . -maxdepth 2 -type f -name "*.py" -print

          echo "======================================"
          echo "FEATURE SERVICE DEFINITIONS"
          echo "======================================"

          grep -Rni "aqi_model_features" . --include="*.py" || true
          grep -Rni "aqi_prediction_context" . --include="*.py" || true

          echo "======================================"
          echo "MODEL_FEATURES DEFINITIONS"
          echo "======================================"

          grep -Rni "MODEL_FEATURES" . --include="*.py" || true

      - name: Debug Feast definitions
        working-directory: feature_repo/feature_repo
        run: |
          echo "======================================"
          echo "GIT COMMIT"
          echo "======================================"
          git rev-parse HEAD

          echo "======================================"
          echo "FEATURES.PY SERVICE DEFINITIONS"
          echo "======================================"
          grep -n -A8 -B5 "aqi_model_features = FeatureService" features.py
          grep -n -A8 -B5 "aqi_prediction_context = FeatureService" features.py

          echo "======================================"
          echo "MODEL FEATURE COUNT FROM SOURCE"
          echo "======================================"

          python - <<'PY'
          import features

          print("features.py loaded from:")
          print(features.__file__)

          print()
          print("MODEL_FEATURES =", len(features.MODEL_FEATURES))
          print("MODEL_FEATURES unique =", len(set(features.MODEL_FEATURES)))
          print("us_aqi in MODEL_FEATURES =", "us_aqi" in features.MODEL_FEATURES)
          print("target_aqi in MODEL_FEATURES =", "target_aqi" in features.MODEL_FEATURES)

          print()
          print("PREDICTION_CONTEXT_FEATURES =", len(features.PREDICTION_CONTEXT_FEATURES))
          print("us_aqi in CONTEXT =", "us_aqi" in features.PREDICTION_CONTEXT_FEATURES)
          print("target_aqi in CONTEXT =", "target_aqi" in features.PREDICTION_CONTEXT_FEATURES)

          print()
          print("======================================")
          print("FEATURE VIEW SCHEMA")
          print("======================================")

          print([
              f.name
              for f in features.aqi_features.schema
          ])

          print()
          print("======================================")
          print("FEATURE SERVICES FROM PYTHON MODULE")
          print("======================================")

          print("MODEL SERVICE:")
          print([
              f.name
              for p in features.aqi_model_features.feature_view_projections
              for f in p.features
          ])

          print()
          print("CONTEXT SERVICE:")
          print([
              f.name
              for p in features.aqi_prediction_context.feature_view_projections
              for f in p.features
          ])
          PY

      # ======================================================
      # FEAST APPLY
      # ======================================================

      - name: Apply Feast definitions
        working-directory: feature_repo/feature_repo
        run: |
          feast apply

      # ======================================================
      # FEAST MATERIALIZE
      # ======================================================

      - name: Materialize Feast online store
        working-directory: feature_repo/feature_repo
        run: |

          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%S")

          feast materialize-incremental \
            "$CURRENT_TIME"

      # ======================================================
      # VERIFY ONLINE STORE
      # ======================================================

      - name: Verify Feast online store
        working-directory: feature_repo/feature_repo
        run: |

          python - <<'PY'

          from feast import FeatureStore

          store = FeatureStore(repo_path=".")

          # ==================================================
          # 70 MODEL FEATURES
          #
          # IMPORTANT:
          # us_aqi is NOT a model feature.
          # target_aqi is NOT a model feature.
          # ==================================================

          MODEL_FEATURES = [

              # WEATHER
              "temperature_2m",
              "relative_humidity_2m",
              "pressure_msl",
              "precipitation",
              "wind_speed_10m",
              "wind_direction_10m",

              # POLLUTANTS
              "pm2_5",
              "pm10",
              "carbon_monoxide",
              "nitrogen_dioxide",
              "sulphur_dioxide",
              "ozone",

              # TIME
              "hour",
              "day_of_week",
              "day_of_month",
              "month",
              "is_weekend",

              # AQI LAGS
              "aqi_lag_1",
              "aqi_lag_3",
              "aqi_lag_6",
              "aqi_lag_12",
              "aqi_lag_24",
              "aqi_lag_48",
              "aqi_lag_72",

              # PM2.5 LAGS
              "pm2_5_lag_1",
              "pm2_5_lag_3",
              "pm2_5_lag_6",
              "pm2_5_lag_24",

              # PM10 LAGS
              "pm10_lag_1",
              "pm10_lag_3",
              "pm10_lag_6",
              "pm10_lag_24",

              # CO LAGS
              "carbon_monoxide_lag_1",
              "carbon_monoxide_lag_3",
              "carbon_monoxide_lag_6",
              "carbon_monoxide_lag_24",

              # NO2 LAGS
              "nitrogen_dioxide_lag_1",
              "nitrogen_dioxide_lag_3",
              "nitrogen_dioxide_lag_6",
              "nitrogen_dioxide_lag_24",

              # SO2 LAGS
              "sulphur_dioxide_lag_1",
              "sulphur_dioxide_lag_3",
              "sulphur_dioxide_lag_6",
              "sulphur_dioxide_lag_24",

              # OZONE LAGS
              "ozone_lag_1",
              "ozone_lag_3",
              "ozone_lag_6",
              "ozone_lag_24",

              # AQI ROLLING MEANS
              "aqi_3h_mean",
              "aqi_6h_mean",
              "aqi_12h_mean",
              "aqi_24h_mean",

              # PM2.5 ROLLING MEANS
              "pm2_5_3h_mean",
              "pm2_5_6h_mean",
              "pm2_5_24h_mean",

              # PM10 ROLLING MEANS
              "pm10_3h_mean",
              "pm10_6h_mean",
              "pm10_24h_mean",

              # OTHER POLLUTANT ROLLING MEANS
              "carbon_monoxide_24h_mean",
              "nitrogen_dioxide_24h_mean",
              "sulphur_dioxide_24h_mean",
              "ozone_24h_mean",

              # AQI CHANGES
              "aqi_change_1h",
              "aqi_change_3h",
              "aqi_change_6h",
              "aqi_change_24h",

              # PM2.5 CHANGES
              "pm2_5_change_1h",
              "pm2_5_change_24h",

              # PM10 CHANGES
              "pm10_change_1h",
              "pm10_change_24h",
          ]

          # ==================================================
          # CONTRACT
          # ==================================================

          assert len(MODEL_FEATURES) == 70, (
              f"Expected 70 model features, "
              f"got {len(MODEL_FEATURES)}"
          )

          assert len(set(MODEL_FEATURES)) == 70, (
              "Duplicate model features detected"
          )

          assert "us_aqi" not in MODEL_FEATURES
          assert "target_aqi" not in MODEL_FEATURES

          # Prediction context = 70 model features + us_aqi
          CONTEXT_FEATURES = MODEL_FEATURES + ["us_aqi"]

          assert len(CONTEXT_FEATURES) == 71
          assert len(set(CONTEXT_FEATURES)) == 71

          # ==================================================
          # VERIFY MODEL FEATURE SERVICE
          # ==================================================

          model_service = store.get_feature_service(
              "aqi_model_features"
          )

          model_service_features = [
              feature.name
              for projection in model_service.feature_view_projections
              for feature in projection.features
          ]

          assert len(model_service_features) == 70, (
              f"aqi_model_features exposes "
              f"{len(model_service_features)} features; "
              f"expected 70"
          )

          assert len(set(model_service_features)) == 70

          assert set(model_service_features) == set(
              MODEL_FEATURES
          ), (
              "aqi_model_features does not exactly match "
              "the 70 model features"
          )

          assert "us_aqi" not in model_service_features
          assert "target_aqi" not in model_service_features

          # ==================================================
          # VERIFY PREDICTION CONTEXT SERVICE
          # ==================================================

          context_service = store.get_feature_service(
              "aqi_prediction_context"
          )

          context_service_features = [
              feature.name
              for projection in context_service.feature_view_projections
              for feature in projection.features
          ]

          assert len(context_service_features) == 71, (
              f"aqi_prediction_context exposes "
              f"{len(context_service_features)} features; "
              f"expected 71"
          )

          assert len(set(context_service_features)) == 71

          assert set(context_service_features) == set(
              CONTEXT_FEATURES
          ), (
              "aqi_prediction_context does not exactly match "
              "70 model features + us_aqi"
          )

          assert "us_aqi" in context_service_features
          assert "target_aqi" not in context_service_features

          # ==================================================
          # VERIFY ONLINE STORE
          # ==================================================

          feature_refs = [
              f"aqi_features:{feature}"
              for feature in CONTEXT_FEATURES
          ]

          result = store.get_online_features(
              features=feature_refs,
              entity_rows=[
                  {
                      "location_id": "peshawar"
                  }
              ],
          ).to_dict()

          # Entity
          assert result["location_id"][0] == "peshawar"

          # Every context feature must exist and be populated
          for feature in CONTEXT_FEATURES:

              assert feature in result, (
                  f"Missing online feature: {feature}"
              )

              assert result[feature][0] is not None, (
                  f"NULL online feature: {feature}"
              )

          # Explicit recursive state check
          assert result["us_aqi"][0] is not None

          print()
          print("======================================")
          print("FEAST ONLINE STORE VERIFIED")
          print("======================================")
          print("Model features:", len(MODEL_FEATURES))
          print("Context features:", len(CONTEXT_FEATURES))
          print("us_aqi:", result["us_aqi"][0])
          print("location_id:", result["location_id"][0])
          print("======================================")
          print("✓ 70 model features")
          print("✓ us_aqi available as recursive state")
          print("✓ target_aqi excluded")
          print("✓ aqi_model_features = 70")
          print("✓ aqi_prediction_context = 71")
          print("✓ All online features populated")
          print("✓ FEAST ONLINE STORE VERIFIED")
          print("======================================")

          PY
      # ======================================================
      # FEAST TESTS
      # ======================================================

      - name: Run Feast tests
        run: |
          pytest -q feature_repo/feature_repo/test_feast.py

      # ======================================================
      # SAVE PIPELINE STATE
      # ======================================================

      - name: Save pipeline data
        uses: actions/upload-artifact@v4
        with:
          name: aqi-pipeline-data
          path: |
            data/raw/peshawar_openmeteo_2024_2026.csv
            data/processed/aqi_features.parquet
            
          retention-days: 7
          overwrite: true
          if-no-files-found: error