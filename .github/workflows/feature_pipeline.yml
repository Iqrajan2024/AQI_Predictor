name: Pearls AQI - Hourly Feature Pipeline

on:
  schedule:
    # Every hour at minute 15
    - cron: "15 * * * *"

  workflow_dispatch:

jobs:
  feature_pipeline:
    name: Run Feature Engineering
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # --------------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # --------------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow

      # --------------------------------------------------------
      # 4. Run feature engineering
      # --------------------------------------------------------
      - name: Run feature engineering pipeline
        run: |
          python src/features/build_features.py

      # --------------------------------------------------------
      # 5. Verify feature dataset
      # --------------------------------------------------------
      - name: Verify feature dataset
        run: |
          python -c "import pandas as pd; df=pd.read_parquet('data/processed/aqi_features.parquet'); print('Feature dataset shape:', df.shape); print('Missing values:', df.isna().sum().sum())"