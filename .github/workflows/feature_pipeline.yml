name: Pearls AQI - Hourly Feature Pipeline

on:
  schedule:
    - cron: "15 * * * *"

  workflow_dispatch:

jobs:
  feature_pipeline:
    name: Run Feature Engineering
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests pytest

      # --------------------------------------------------------
      # GENERATE RAW DATA
      # --------------------------------------------------------
      - name: Generate raw dataset
        run: |
          python src/data/historical_backfill.py

      # --------------------------------------------------------
      # VERIFY RAW DATA
      # --------------------------------------------------------
      - name: Verify raw dataset
        run: |
          echo "Current directory:"
          pwd

          echo "Raw dataset:"
          ls -lh data/raw/

          test -f data/raw/peshawar_openmeteo_2024_2026.csv

      # --------------------------------------------------------
      # BUILD FEATURES
      # --------------------------------------------------------
      - name: Run feature engineering
        run: |
          python src/features/build_features.py

      # --------------------------------------------------------
      # VERIFY FEATURE FILE BEFORE TESTING
      # --------------------------------------------------------
      - name: Verify generated feature file
        run: |
          echo "Current directory:"
          pwd

          echo "Processed directory:"
          ls -lah data/processed/

          test -f data/processed/aqi_features.parquet

          python -c "import pandas as pd; df=pd.read_parquet('data/processed/aqi_features.parquet'); print('Shape:', df.shape); print('Columns:', df.columns.tolist()); print('Missing:', df.isna().sum().sum())"

      # --------------------------------------------------------
      # TEST
      # --------------------------------------------------------
      - name: Run feature tests
        run: |
          python -m pytest tests/test_features.py -v