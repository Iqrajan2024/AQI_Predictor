name: Pearls AQI - Hourly Feature Pipeline

on:
  schedule:
    - cron: "15 * * * *"

  workflow_dispatch:

jobs:
  feature_pipeline:
    name: Run Feature Engineering
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyarrow

      # --------------------------------------------------------
      # Generate/download raw dataset
      # --------------------------------------------------------
      - name: Download raw Open-Meteo dataset
        run: |
          python src/data/historical_backfill.py

      # --------------------------------------------------------
      # Verify raw dataset
      # --------------------------------------------------------
      - name: Verify raw dataset
        run: |
          python -c "from pathlib import Path; p=Path('data/raw/peshawar_openmeteo_2024_2026.csv'); print('Raw dataset exists:', p.exists()); print('Raw dataset size:', p.stat().st_size if p.exists() else 0); assert p.exists(), 'Raw dataset was not generated'"

      # --------------------------------------------------------
      # Build features
      # --------------------------------------------------------
      - name: Run feature engineering pipeline
        run: |
          python src/features/build_features.py

      # --------------------------------------------------------
      # Verify feature dataset
      # --------------------------------------------------------
      - name: Verify feature dataset
        run: |
          python -c "import pandas as pd; from pathlib import Path; p=Path('data/processed/aqi_features.parquet'); print('Feature file exists:', p.exists()); assert p.exists(), 'Feature file was not generated'; df=pd.read_parquet(p); print('Feature dataset shape:', df.shape); print('Missing values:', df.isna().sum().sum()); assert len(df) > 0, 'Feature dataset is empty'"