name: Pearls AQI - Hourly Feature Pipeline

on:
  schedule:
    - cron: "15 * * * *"

  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:

  feature_pipeline:

    name: Run Incremental Feature Pipeline

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ======================================================
      # 2. SETUP PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      # ======================================================
      # 3. INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests pytest


      # ======================================================
      # 4. RESTORE LATEST PIPELINE ARTIFACT
      #
      # IMPORTANT:
      # download-artifact without run-id only searches
      # artifacts from the CURRENT workflow run.
      #
      # We explicitly find the latest successful run of
      # THIS workflow and download its artifact.
      # ======================================================

      - name: Restore latest pipeline artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: feature_pipeline.yml
        run: |

          echo "Searching for latest successful feature-pipeline run..."

          RUN_ID=$(gh run list \
            --repo "$REPO" \
            --workflow "$WORKFLOW_FILE" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "No previous successful pipeline run found."
            echo "This is the INITIAL BACKFILL."
            exit 0
          fi

          echo "Latest successful workflow run: $RUN_ID"

          mkdir -p .pipeline_restore

          gh run download "$RUN_ID" \
            --repo "$REPO" \
            --name aqi-pipeline-data \
            --dir .pipeline_restore

          echo "Restored artifact contents:"

          find .pipeline_restore -type f -print


      # ======================================================
      # 5. RESTORE DATA INTO NORMAL PROJECT DIRECTORIES
      # ======================================================

      - name: Restore pipeline files
        run: |

          if [ -f ".pipeline_restore/data/raw/peshawar_openmeteo_2024_2026.csv" ]; then

            echo "Restoring previous raw dataset..."

            mkdir -p data/raw

            cp \
              ".pipeline_restore/data/raw/peshawar_openmeteo_2024_2026.csv" \
              "data/raw/peshawar_openmeteo_2024_2026.csv"

          else

            echo "No previous raw dataset found."
            echo "INITIAL BACKFILL will be performed."

          fi


          if [ -f ".pipeline_restore/data/processed/aqi_features.parquet" ]; then

            echo "Restoring previous feature dataset..."

            mkdir -p data/processed

            cp \
              ".pipeline_restore/data/processed/aqi_features.parquet" \
              "data/processed/aqi_features.parquet"

          fi


      # ======================================================
      # 6. CHECK CURRENT STATE
      # ======================================================

      - name: Check existing raw dataset
        run: |

          if [ -f "data/raw/peshawar_openmeteo_2024_2026.csv" ]; then

            echo "=============================================="
            echo "EXISTING RAW DATASET FOUND"
            echo "=============================================="

            python - <<'PY'
          import pandas as pd

          path = "data/raw/peshawar_openmeteo_2024_2026.csv"

          df = pd.read_csv(path)

          print("Rows:", len(df))
          print("First:", df["timestamp"].min())
          print("Latest:", df["timestamp"].max())
          print("Columns:", len(df.columns))
          PY

          else

            echo "=============================================="
            echo "NO RAW DATASET FOUND"
            echo "INITIAL BACKFILL REQUIRED"
            echo "=============================================="

          fi


      # ======================================================
      # 7. UPDATE RAW DATASET
      #
      # update_raw_dataset.py MUST implement:
      #
      # NO FILE:
      #     2024-08-01 -> current
      #
      # FILE EXISTS:
      #     latest timestamp -> current
      #
      # ======================================================

      - name: Update raw Open-Meteo dataset
        run: |

          python src/data/update_raw_dataset.py


      # ======================================================
      # 8. VERIFY RAW DATA
      # ======================================================

      - name: Verify raw dataset
        run: |

          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          path = Path(
              "data/raw/peshawar_openmeteo_2024_2026.csv"
          )

          assert path.exists(), (
              "Raw dataset was not created."
          )

          df = pd.read_csv(path)

          assert len(df) > 0, (
              "Raw dataset is empty."
          )

          assert "timestamp" in df.columns, (
              "timestamp column missing."
          )

          print("==============================================")
          print("RAW DATASET VERIFIED")
          print("==============================================")
          print("Shape:", df.shape)
          print("First:", df["timestamp"].min())
          print("Last:", df["timestamp"].max())
          print("Missing values:", df.isna().sum().sum())
          PY


      # ======================================================
      # 9. BUILD FEATURES
      # ======================================================

      - name: Run feature engineering
        run: |

          python src/features/build_features.py


      # ======================================================
      # 10. VERIFY FEATURE DATASET
      # ======================================================

      - name: Verify feature dataset
        run: |

          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          path = Path(
              "data/processed/aqi_features.parquet"
          )

          assert path.exists(), (
              "Feature dataset was not created."
          )

          df = pd.read_parquet(path)

          assert len(df) > 0, (
              "Feature dataset is empty."
          )

          assert "timestamp" in df.columns, (
              "timestamp column missing."
          )

          assert "target_aqi" in df.columns, (
              "target_aqi column missing."
          )

          print("==============================================")
          print("FEATURE DATASET VERIFIED")
          print("==============================================")
          print("Shape:", df.shape)
          print("First:", df["timestamp"].min())
          print("Last:", df["timestamp"].max())
          print("Missing values:", df.isna().sum().sum())
          PY


      # ======================================================
      # 11. RUN FEATURE TESTS
      # ======================================================

      - name: Run feature tests
        run: |

          pytest -q tests/test_features.py


      # ======================================================
      # 12. UPLOAD UPDATED PIPELINE STATE
      #
      # This becomes the input for the NEXT hourly run.
      # ======================================================

      - name: Save latest pipeline state
        uses: actions/upload-artifact@v4
        with:
          name: aqi-pipeline-data
          path: |
            data/raw/peshawar_openmeteo_2024_2026.csv
            data/processed/aqi_features.parquet
          retention-days: 30
          overwrite: true