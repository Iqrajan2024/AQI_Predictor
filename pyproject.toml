[project]
name = "pearls-aqi-predictor"
version = "1.0.0"
description = "Pearls AQI Predictor API"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi[standard]==0.141.1",
    "uvicorn==0.34.0",
    "numpy==2.4.2",
    "pandas==2.3.3",
    "pyarrow==25.0.1",
    "scikit-learn==1.8.0",
    "xgboost==3.4.1",
    "joblib==1.5.3",
    "feast[duckdb]==0.66.0",
    "psycopg==3.3.3",
    "psycopg-binary==3.3.3",
    "psycopg-pool==3.3.1",
    "SQLAlchemy==2.0.36",
    "mlflow==3.15.1",
    "httpx==0.28.1",
    "requests==2.32.5",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.3",
    "shap==0.52.0",
    "llvmlite>=0.44.0",
    "numba>=0.61.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.fastapi]
entrypoint = "src.api.main:app"